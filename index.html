<!doctype html>
<html lang="sw"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R-Search</title>
<style>
:root{--ink:#14181f;--mut:#667085;--line:#e4e7ec;--bg:#e9ebee;--acc:#0b6e63;--soft:#e6f3f1}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:16px/1.55 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--acc)}
.logo b{color:var(--ink)}
.ic{display:flex;gap:8px}
.ic button{width:40px;height:40px;border-radius:50%;background:var(--bg);font-size:20px;display:grid;place-items:center}
.sb{display:flex;gap:10px;align-items:center;padding:6px 14px 12px;background:#fff}
.sb .av{flex:none}
.sb form{flex:1;min-width:0;display:flex;border-radius:28px;background:#eef0f3;overflow:hidden;border:1.5px solid transparent}
.sb form:focus-within{border-color:var(--acc);background:#fff}
.sb input{flex:1;min-width:0;border:0;background:none;padding:12px 6px 12px 18px;font:inherit;font-size:17px;outline:0}
.sb form button{margin:4px;padding:0 16px;border-radius:22px;background:var(--acc);color:#fff;font-weight:600}
nav{display:flex;overflow-x:auto;background:#fff;scrollbar-width:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 25%;padding:8px 6px 6px;color:var(--mut);font-weight:600;font-size:13px;border-bottom:3px solid transparent;line-height:1.3}
nav button span{display:block;font-size:24px;filter:grayscale(1);opacity:.7}
nav button[aria-selected=true] span{filter:none;opacity:1}
nav button[aria-selected=true]{color:var(--acc);border-color:var(--acc)}
#menu{display:none;position:absolute;right:10px;top:58px;width:min(300px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px #0002;padding:10px}
#menu.on{display:block}
#menu h4{font-size:14px;color:var(--mut);margin:4px 6px}
#menu button.h{display:block;width:100%;text-align:left;padding:8px 6px;border-radius:8px}
#menu button.h:hover{background:var(--bg)}
main{padding:0 0 40px}
.card{background:#fff;border-bottom:8px solid var(--bg);margin:0;overflow:hidden}
.sec{font-weight:700;padding:12px 14px 6px;font-size:17px;background:#fff}
.stories{display:flex;gap:8px;overflow-x:auto;padding:4px 10px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.story{flex:none;width:136px;height:210px;border-radius:14px;position:relative;overflow:hidden;background:#dde3e8;scroll-snap-align:start;border:1px solid var(--line)}
.story.add{background:#f3f5f7;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 6px 12px;gap:6px;font-weight:700;font-size:14px}
.story.add i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;font-size:28px;font-style:normal;border:3px solid #fff}
.story img{width:100%;height:100%;object-fit:cover}
.story span{position:absolute;inset:auto 0 0;padding:22px 8px 7px;color:#fff;font-size:13px;line-height:1.25;background:linear-gradient(transparent,#000b)}
.story small{display:block;opacity:.8;font-size:11px}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;border:3px solid #fff;box-shadow:0 0 0 2px var(--acc)}
.ph .x{margin-left:auto;display:flex;gap:2px}.ph .x button{width:36px;height:36px;font-size:20px;color:var(--mut)}
.ph>div:nth-child(2){flex:none}.ph b{display:block;line-height:1.2}.ph small{color:var(--mut)}
.q{padding:0 14px 6px;color:var(--mut);font-size:15px}
.body{padding:2px 14px 12px}
.body h3{font-size:20px;line-height:1.3;margin-bottom:6px}
.body p{margin-bottom:8px}
.body ul{padding-left:20px;margin-bottom:8px}.body li{margin-bottom:4px}
.pic{margin:0 0 4px;background:var(--bg)}
.pic img{display:block;width:100%;max-height:360px;object-fit:cover}
.pic small{display:block;padding:4px 14px;color:var(--mut);font-size:12px}
.src{padding:6px 14px 12px;font-size:14px}
.src a{display:block;color:var(--acc);padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act{display:flex;border-top:1px solid var(--line)}
.act button{flex:1;padding:12px;color:var(--mut);font-weight:600;font-size:15px}
.act button:hover{background:var(--bg)}
.meta{display:flex;gap:8px;color:var(--mut);font-size:13px;padding:12px 14px 2px}
.meta b{color:var(--ink)}
.rt{font-weight:700;padding:8px 14px 4px;font-size:16px;line-height:1.35}
.sn{padding:0 14px 8px;color:#3c4452}
.open{display:inline-block;margin:0 14px 14px;color:var(--acc);font-weight:700;text-decoration:none}
.mas{columns:2;column-gap:8px;padding:0 10px}
.mas figure{break-inside:avoid;margin:0 0 8px;border-radius:12px;overflow:hidden;background:#dde3e8;cursor:pointer;position:relative}
.mas img{display:block;width:100%}
.mas figcaption{position:absolute;inset:auto 0 0;padding:16px 7px 5px;color:#fff;font-size:11px;background:linear-gradient(transparent,#000a)}
.vgrid{display:grid;gap:12px;padding:0 10px}
.vid{cursor:pointer;text-align:left;width:100%}
.th{position:relative;aspect-ratio:16/9;background:#1b222b}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.pl{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;color:#fff;text-shadow:0 2px 10px #0008}
.du{position:absolute;right:8px;bottom:8px;background:#000b;color:#fff;font-size:12px;padding:1px 7px;border-radius:6px}
.au{display:flex;gap:12px;align-items:center;padding:14px}
.au .p{flex:none;width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;font-size:18px}
.au .i{flex:1;min-width:0}
.au b{display:block;line-height:1.3}
.au small{color:var(--mut)}
.bar{height:6px;border-radius:3px;background:var(--line);margin:8px 0 3px;cursor:pointer;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.tm{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.msg{text-align:center;color:var(--mut);padding:34px 20px}
.err{color:#b42318}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px}
.sk{height:120px;background:linear-gradient(90deg,#eceff2,#f8f9fa,#eceff2);background-size:200%;animation:sh 1.2s infinite;border-radius:16px;margin:0 0 12px}
@keyframes sh{to{background-position:-200%}}
#lb{position:fixed;inset:0;background:#000e;z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
#lb.on{display:flex}
#lb img,#lb video{max-width:100%;max-height:86vh;border-radius:10px}
#lb button{position:absolute;top:10px;right:14px;color:#fff;font-size:34px}
@media(min-width:760px){.card{border-radius:0}.sb input{font-size:19px;padding:17px 24px}.mas{columns:3}.vgrid{grid-template-columns:1fr 1fr}.story{width:132px;height:190px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head>
<body>
<header><div class="wrap">
 <div class="top"><div class="logo">R<b>-Search</b></div>
  <div class="ic"><button id="plus" aria-label="Utafutaji mpya">+</button><button id="mag" aria-label="Tafuta">&#9906;</button><button id="mn" aria-label="Menyu">&#9776;</button></div></div>
 <div id="menu"></div>
 <div class="sb"><div class="av">R</div><form id="f"><input id="q" type="search" placeholder="Unatafuta nini?" autocomplete="off" aria-label="Unatafuta nini?"><button>Tafuta</button></form></div>
 <nav role="tablist"></nav>
</div></header>
<div class="wrap"><main id="out"></main></div>
<div id="lb"><button aria-label="Funga">&times;</button><div id="lbc"></div></div>
<script>
const $=s=>document.querySelector(s),TK="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",PX="57792634-5e89dd610e4c1c840f815c524";
const TABS=[["all","Yote","🔎"],["img","Picha","🖼️"],["vid","Video","🎥"],["aud","Audio","🎧"]];
const EX=["Mafunzo ya zimamoto","Moto wa nyumba","Hali ya hewa Lindi","How to use SCBA","Fire safety training"];
let tab="all",q="",S={},run=0,cur=null;
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n};
const safe=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:"#"}catch(e){return"#"}};
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}};
const mmss=s=>{s=Math.round(s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const hist=()=>{try{return JSON.parse(localStorage.getItem("rs_h")||"[]")}catch(e){return[]}};
const saveH=v=>{try{const h=[v,...hist().filter(x=>x!==v)].slice(0,8);localStorage.setItem("rs_h",JSON.stringify(h))}catch(e){}};
async function tr(t,tl){try{const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl="+tl+"&dt=t&q="+encodeURIComponent(t));if(!r.ok)return t;const j=await r.json();return(j[0]||[]).map(x=>x[0]).join("")||t}catch(e){return t}}
async function jget(u,o){let r;try{r=await fetch(u,o)}catch(e){throw new Error("Imeshindwa kuunganisha. Angalia intaneti yako.")}
 if(r.status===429)throw new Error("Umefikia kikomo cha maombi. Jaribu tena baadaye.");
 if(!r.ok)throw new Error("Hitilafu imetokea ("+r.status+").");return r.json()}
/* Tabs */
const nav=$("nav");
TABS.forEach(([k,l,ic])=>{const b=el("button");b.append(el("span",null,ic),l);b.role="tab";b.dataset.k=k;b.onclick=()=>setTab(k);nav.append(b)});
function setTab(k){tab=k;nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===k));scrollTo(0,0);if(q)render();else home()}
/* Search */
$("#f").onsubmit=e=>{e.preventDefault();const v=$("#q").value.trim();if(v){$("#q").blur();go(v)}};
$("#plus").onclick=$("#mag").onclick=()=>{$("#q").focus();$("#q").select()};
$("#mn").onclick=()=>{const m=$("#menu");m.replaceChildren(el("h4",null,"Ulizotafuta hivi karibuni"));
 const h=hist();if(!h.length)m.append(el("p","msg","Bado hakuna."));
 h.forEach(x=>{const b=el("button","h",x);b.onclick=()=>{m.classList.remove("on");go(x)};m.append(b)});
 if(h.length){const c=el("button","h","Futa historia");c.onclick=()=>{try{localStorage.removeItem("rs_h")}catch(e){}m.classList.remove("on")};m.append(c)}
 m.classList.toggle("on")};
document.addEventListener("click",e=>{if(!e.target.closest("#menu,#mn"))$("#menu").classList.remove("on")});
function go(v){q=v;$("#q").value=v;saveH(v);S={};const id=++run;
 $("#out").replaceChildren(el("div","sk"),el("div","sk"),el("div","sk"));
 const pe=tr(v,"en").then(en=>en.slice(0,100));
 S.imgP=pe.then(en=>jget("https://pixabay.com/api/?key="+PX+"&q="+encodeURIComponent(en)+"&per_page=24&safesearch=true")).then(d=>S.imgs=(d.hits||[]).map(h=>({u:h.webformatURL,l:h.largeImageURL,t:h.tags||v}))).catch(()=>S.imgs=[]);
 S.webP=jget("https://api.tavily.com/search",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+TK},body:JSON.stringify({query:v,search_depth:"advanced",max_results:10,include_answer:true,include_images:true})})
  .then(async d=>{S.web={ans:d.answer?await tr(d.answer,"sw"):"",res:d.results||[],ims:(d.images||[]).map(x=>typeof x==="string"?x:x.url).filter(Boolean)}}).catch(e=>{S.web={err:e.message,res:[],ims:[]}});
 S.pe=pe;
 Promise.all([S.imgP,S.webP]).then(()=>{if(id===run){render();if(S.web&&!S.web.err)try{localStorage.setItem("rs_cache",JSON.stringify({q:v,web:S.web,imgs:S.imgs||[]}))}catch(e){}}});
 if(tab!=="all")render()}
function home(){const o=$("#out");const b=el("div","msg");b.append(el("p",null,"Andika swali au neno unalotafuta."));
 const c=el("div","chips");EX.forEach(x=>{const k=el("button",null,x);k.onclick=()=>go(x);c.append(k)});b.append(c);o.replaceChildren(b)}
async function lazy(kind){const en=await S.pe,id=run;
 try{if(kind==="vid"){const d=await jget("https://pixabay.com/api/videos/?key="+PX+"&q="+encodeURIComponent(en)+"&per_page=18&safesearch=true");
   S.vid=(d.hits||[]).map(h=>{const v=h.videos||{};return{t:h.tags,u:(v.small||v.tiny||v.medium||{}).url,p:h.picture_id?"https://i.vimeocdn.com/video/"+h.picture_id+"_640x360.jpg":"",d:h.duration,by:h.user}}).filter(x=>x.u)}
  else{const d=await jget("https://api.openverse.org/v1/audio/?page_size=15&q="+encodeURIComponent(en));
   S.aud=(d.results||[]).filter(x=>x.url).map(x=>({t:x.title||"Bila jina",u:x.url,by:x.creator||"",src:x.source||x.provider||"Openverse",d:(x.duration||0)/1000}))}
 }catch(e){S[kind]=[];S[kind+"Err"]=e.message}
 if(id===run&&tab===kind)render()}
/* Render */
function render(){const o=$("#out");if(!q)return home();
 if(tab==="all"){if(!S.web){return}o.replaceChildren(stories(),ai(),results());return}
 if(tab==="img"){if(!S.imgs){o.replaceChildren(el("div","sk"));return}o.replaceChildren(grid());return}
 if(!S[tab]){o.replaceChildren(el("div","sk"),el("div","sk"));lazy(tab);return}
 if(S[tab+"Err"])return void o.replaceChildren(el("p","msg err",S[tab+"Err"]));
 if(!S[tab].length)return void o.replaceChildren(el("p","msg","Hakuna "+(tab==="vid"?"video":"audio")+' za "'+q+'".'));
 o.replaceChildren(tab==="vid"?vids():auds())}
function img(u,alt){const i=el("img");i.src=safe(u);i.alt=alt||"";i.loading="lazy";i.referrerPolicy="no-referrer";return i}
function stories(){const c=el("div","card"),r=el("div","stories");const pool=[...(S.imgs||[]).slice(0,8)];
 if(!pool.length)return document.createDocumentFragment();
 c.append(el("div","sec","Picha Zinazohusiana"));
 const ad=el("button","story add");ad.append(el("i",null,"+"),"Picha zote");ad.onclick=()=>setTab("img");r.append(ad);
 pool.forEach(p=>{const s=el("button","story"),sp=el("span",null,p.t.split(",")[0]);sp.append(el("small",null,"Pixabay"));
  const i=img(p.u,p.t);i.onerror=()=>s.remove();s.append(i,sp);s.onclick=()=>lb(img(p.l||p.u,p.t));r.append(s)});
 c.append(r);return c}
function ai(){const c=el("article","card"),W=S.web;
 const h=el("div","ph");h.append(el("div","av","R"));const n=el("div");n.append(el("b",null,"R-Search AI"),el("small",null,"Jibu la AI · sasa hivi 🌐"));h.append(n);
 const xs=el("div","x"),d1=el("button",null,"⋯"),d2=el("button",null,"✕");d2.setAttribute("aria-label","Ficha jibu");d1.setAttribute("aria-label","Zaidi");d2.onclick=()=>c.remove();xs.append(d1,d2);h.append(xs);
 c.append(h,el("div","q","Umeuliza: "+q));
 d1.onclick=()=>{const a=c.querySelector(".act button:nth-child(3)");if(a)a.click()};
 if(W.err||!W.ans){c.append(el("p","msg",W.err||"AI haikuweza kuandaa jibu la swali hili. Tazama matokeo hapa chini."));return c}
 const ss=W.ans.split(/(?<=[.!?])\s+/).filter(Boolean),b=el("div","body");
 b.append(el("h3",null,q),el("p",null,ss.slice(0,2).join(" ")));
 if(ss.length>2){const u=el("ul");ss.slice(2,8).forEach(x=>u.append(el("li",null,x)));b.append(u)}
 c.append(b);
 const pool=W.ims.length?W.ims:(S.imgs||[]).map(x=>x.l||x.u);
 if(pool[0]){const f=el("figure","pic"),i=img(pool[0],q);i.onerror=()=>f.remove();f.append(i,el("small",null,"Picha inayohusiana na jibu"));c.append(f)}
 const s=el("div","src");s.id="src";s.append(el("b",null,"Vyanzo"));
 W.res.slice(0,4).forEach(x=>{const a=el("a",null,"• "+host(x.url));a.href=safe(x.url);a.target="_blank";a.rel="noopener noreferrer";s.append(a)});c.append(s);
 const ac=el("div","act"),b1=el("button",null,"Vyanzo"),b2=el("button",null,"Nakili"),b3=el("button",null,"Shiriki");
 b1.onclick=()=>s.scrollIntoView({behavior:"smooth",block:"center"});
 b2.onclick=async()=>{try{await navigator.clipboard.writeText(W.ans);b2.textContent="Imenakiliwa"}catch(e){b2.textContent="Imeshindikana"}setTimeout(()=>b2.textContent="Nakili",1800)};
 b3.onclick=()=>{const d={title:"R-Search: "+q,text:W.ans.slice(0,200),url:location.href};navigator.share?navigator.share(d).catch(()=>{}):b2.click()};
 ac.append(b1,b2,b3);c.append(ac);return c}
function results(){const f=document.createDocumentFragment(),W=S.web;
 if(!W.res.length){f.append(el("p","msg",'Hakuna matokeo ya "'+q+'".'));return f}
 f.append(el("div","sec","Matokeo ya Utafutaji"));
 const pool=W.ims.slice(1);
 W.res.forEach((x,i)=>{const c=el("article","card");
  const m=el("div","meta");m.append(el("b",null,host(x.url)));if(x.published_date)m.append(el("span",null,x.published_date.slice(0,16)));
  const t=el("div","rt",x.title||x.url),sn=el("p","sn",(x.content||"").slice(0,240)+((x.content||"").length>240?"...":""));
  c.append(m,t,sn);
  if(pool[i]){const fg=el("figure","pic"),im=img(pool[i],x.title);im.onerror=()=>fg.remove();fg.append(im);c.append(fg)}
  const s=el("div","sn");s.style.fontSize="13px";s.style.color="var(--mut)";s.textContent="Chanzo: "+host(x.url);
  const a=el("a","open","Fungua chanzo →");a.href=safe(x.url);a.target="_blank";a.rel="noopener noreferrer";c.append(s,a);f.append(c)});
 return f}
function grid(){const g=el("div","mas");
 if(!S.imgs.length)return el("p","msg",'Hakuna picha za "'+q+'".');
 S.imgs.forEach(p=>{const f=el("figure"),i=img(p.u,p.t);i.onerror=()=>f.remove();f.append(i,el("figcaption",null,p.t.split(",").slice(0,2).join(",")+" · Pixabay"));f.onclick=()=>lb(img(p.l||p.u,p.t));g.append(f)});return g}
function vids(){const g=el("div","vgrid");
 S.vid.forEach(v=>{const c=el("div","card"),b=el("button","vid"),th=el("div","th");
  if(v.p){const i=img(v.p,v.t);i.onerror=()=>i.remove();th.append(i)}
  th.append(el("div","pl","▶"),el("span","du",mmss(v.d)));
  b.append(th,el("div","rt",v.t.split(",").slice(0,3).join(", ")),el("div","sn","Pixabay · "+(v.by||"")));
  b.onclick=()=>{const vd=el("video");vd.src=safe(v.u);vd.controls=true;vd.autoplay=true;vd.playsInline=true;lb(vd)};
  c.append(b);g.append(c)});return g}
function auds(){const f=document.createDocumentFragment();
 S.aud.forEach(a=>{const c=el("div","card au"),p=el("button","p","▶"),i=el("div","i"),bar=el("div","bar"),fill=el("i");bar.append(fill);
  const tm=el("div","tm"),t1=el("span",null,"0:00"),t2=el("span",null,a.d?mmss(a.d):"");tm.append(t1,t2);
  i.append(el("small",null,"🎧 Audio"),el("b",null,a.t),el("small",null,[a.src,a.by].filter(Boolean).join(" · ")),bar,tm);
  const au=new Audio();au.preload="none";au.src=safe(a.u);
  p.setAttribute("aria-label","Cheza");
  p.onclick=()=>{if(au.paused){if(cur&&cur!==au)cur.pause();cur=au;au.play().catch(()=>{t2.textContent="Haichezi"})}else au.pause()};
  au.onplay=()=>p.textContent="❚❚";au.onpause=()=>p.textContent="▶";
  au.ontimeupdate=()=>{fill.style.width=(au.duration?au.currentTime/au.duration*100:0)+"%";t1.textContent=mmss(au.currentTime)};
  au.onloadedmetadata=()=>t2.textContent=mmss(au.duration);
  bar.onclick=e=>{if(au.duration)au.currentTime=au.duration*(e.offsetX/bar.clientWidth)};
  c.append(p,i);f.append(c)});return f}
/* Lightbox */
function lb(n){const b=$("#lbc");b.replaceChildren(n);$("#lb").classList.add("on")}
function lbx(){$("#lb").classList.remove("on");$("#lbc").replaceChildren()}
$("#lb").onclick=e=>{if(e.target.id!=="lbc"&&e.target.tagName!=="IMG"&&e.target.tagName!=="VIDEO")lbx()};
