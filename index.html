<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R-Search</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    color:#202124;
    background:#fff;
}

header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:0 25px;
    gap:20px;
}

header a{
    color:#444;
    text-decoration:none;
    font-size:14px;
}

.logo{
    text-align:center;
    margin-top:105px;
    font-size:72px;
    font-weight:600;
    letter-spacing:-5px;
}

.logo span:nth-child(1){color:#4285f4;}
.logo span:nth-child(2){color:#ea4335;}
.logo span:nth-child(3){color:#fbbc05;}
.logo span:nth-child(4){color:#4285f4;}
.logo span:nth-child(5){color:#34a853;}
.logo span:nth-child(6){color:#ea4335;}

.tagline{
    text-align:center;
    margin-top:5px;
    color:#5f6368;
    font-size:15px;
}

.search-area{
    max-width:680px;
    margin:28px auto 0;
    padding:0 20px;
}

.search-box{
    height:52px;
    border:1px solid #dfe1e5;
    border-radius:28px;
    display:flex;
    align-items:center;
    padding:0 17px;
    box-shadow:0 1px 6px rgba(32,33,36,.12);
}

.search-box:focus-within{
    box-shadow:0 1px 8px rgba(32,33,36,.20);
}

.search-icon{
    font-size:20px;
    color:#777;
    margin-right:10px;
}

input{
    flex:1;
    border:0;
    outline:0;
    font-size:17px;
    color:#202124;
}

.clear{
    display:none;
    border:0;
    background:none;
    font-size:20px;
    cursor:pointer;
    color:#777;
}

.search-btn{
    margin:20px auto;
    display:block;
    padding:11px 22px;
    border:1px solid #f8f9fa;
    background:#f8f9fa;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
}

.search-btn:hover{
    border:1px solid #dadce0;
    box-shadow:0 1px 1px rgba(0,0,0,.1);
}

#status{
    text-align:center;
    color:#70757a;
    font-size:14px;
    margin:25px 0;
}

.results{
    max-width:850px;
    margin:0 auto;
    padding:0 20px 60px;
}

.result{
    margin-bottom:28px;
}

.result-url{
    color:#188038;
    font-size:14px;
    margin-bottom:5px;
    word-break:break-all;
}

.result-title{
    font-size:21px;
    color:#1a0dab;
    text-decoration:none;
}

.result-title:hover{
    text-decoration:underline;
}

.result-description{
    margin-top:6px;
    line-height:1.55;
    color:#4d5156;
    font-size:14px;
}

.result-domain{
    color:#5f6368;
    font-size:13px;
    margin-top:5px;
}

.error{
    text-align:center;
    color:#b3261e;
    padding:25px;
}

@media(max-width:600px){

    header{
        height:55px;
        padding:0 15px;
    }

    .logo{
        margin-top:80px;
        font-size:55px;
    }

    .search-area{
        margin-top:25px;
    }

    .search-box{
        height:50px;
    }

    input{
        font-size:16px;
    }

    .results{
        padding:0 16px 50px;
    }

    .result-title{
        font-size:18px;
    }
}
</style>
</head>

<body>

<header>
    <a href="https://duckduckgo.com/" target="_blank">Web</a>
</header>

<div class="logo">
    <span>R</span><span>-</span><span>S</span><span>e</span><span>a</span><span>rch</span>
</div>

<div class="tagline">
    Tafuta taarifa kwenye mtandao
</div>

<div class="search-area">

    <div class="search-box">

        <div class="search-icon">⌕</div>

        <input
            id="searchInput"
            type="search"
            placeholder="Tafuta kwenye mtandao..."
            autocomplete="off"
        >

        <button class="clear" id="clearBtn">×</button>

    </div>

    <button class="search-btn" id="searchBtn">
        Tafuta
    </button>

</div>

<div id="status"></div>

<main id="results" class="results"></main>

<script>

/*
    WEKA URL YA CLOUDFLARE WORKER HAPA
    Mfano:

    https://r-search-api.username.workers.dev
*/

const API_URL =
    "https://WEKA-WORKER-URL-HAPA.workers.dev";


const input = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const clearBtn = document.getElementById("clearBtn");
const results = document.getElementById("results");
const status = document.getElementById("status");


input.addEventListener("input", () => {

    clearBtn.style.display =
        input.value ? "block" : "none";

});


clearBtn.addEventListener("click", () => {

    input.value = "";
    clearBtn.style.display = "none";
    input.focus();

});


searchBtn.addEventListener("click", search);


input.addEventListener("keydown", e => {

    if(e.key === "Enter"){
        search();
    }

});


async function search(){

    const query = input.value.trim();

    if(!query){
        input.focus();
        return;
    }

    results.innerHTML = "";

    status.textContent = "Inatafuta...";

    searchBtn.disabled = true;

    try{

        const response = await fetch(
            API_URL +
            "/search?q=" +
            encodeURIComponent(query)
        );

        const data = await response.json();

        if(!response.ok){

            throw new Error(
                data.error ||
                "Search imeshindikana."
            );

        }

        displayResults(data);

    }catch(error){

        console.error(error);

        status.innerHTML =
            `<div class="error">
                ${escapeHTML(error.message)}
             </div>`;

    }finally{

        searchBtn.disabled = false;

    }

}


function displayResults(data){

    const items = data.results || [];

    if(items.length === 0){

        status.textContent =
            "Hakuna matokeo yaliyopatikana.";

        return;
    }

    status.textContent =
        `${items.length} matokeo`;

    results.innerHTML =
        items.map(item => {

            const title =
                item.title ||
                "Ukurasa bila kichwa";

            const url =
                item.url || "#";

            const content =
                item.content ||
                item.description ||
                "";

            let domain = "";

            try{
                domain =
                    new URL(url).hostname;
            }catch(e){}

            return `
                <article class="result">

                    <div class="result-url">
                        ${escapeHTML(url)}
                    </div>

                    <a
                        class="result-title"
                        href="${escapeAttribute(url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${escapeHTML(title)}
                    </a>

                    <div class="result-domain">
                        ${escapeHTML(domain)}
                    </div>

                    <div class="result-description">
                        ${escapeHTML(content)}
                    </div>

                </article>
            `;

        }).join("");

}


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}

</script>

</body>
</html>
