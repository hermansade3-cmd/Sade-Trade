<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-Search — Tafuta chochote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8f9;--card:#fff;--ink:#14232b;--mute:#5d6f78;--line:#d9e1e5;--teal:#0b7a86;--sun:#f4b400;--link:#0a5f9e;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a20;--card:#16252d;--ink:#e8f0f3;--mute:#9bb0ba;--line:#27404b;--teal:#35b7c4;--link:#7cc4f5;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 "Source Sans 3",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.home{padding-top:22vh;text-align:center;transition:padding .2s}
body.has-results header.home{padding-top:20px;display:flex;align-items:center;gap:16px;text-align:left}
.logo{font:800 clamp(44px,12vw,72px)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:0;cursor:pointer}
body.has-results .logo{font-size:30px}
.logo b{color:var(--sun)}
.logo span{color:var(--teal)}
.tag{color:var(--mute);margin:8px 0 24px}
body.has-results .tag{display:none}
form{display:flex;gap:8px;width:100%}
body.has-results form{flex:1}
input[type=search]{flex:1;min-width:0;font:inherit;padding:14px 18px;border:2px solid var(--line);border-radius:28px;background:var(--card);color:var(--ink)}
input[type=search]:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.go{font:600 16px "Source Sans 3",sans-serif;padding:0 22px;border:0;border-radius:28px;background:var(--teal);color:#fff;cursor:pointer}
.tabs{display:none;gap:6px;margin:14px 0 6px;border-bottom:1px solid var(--line)}
body.has-results .tabs{display:flex}
.tab{font:600 15px "Source Sans 3",sans-serif;background:none;border:0;color:var(--mute);padding:8px 14px;cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--sun)}
.answer{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sun);border-radius:10px;padding:14px 18px;margin:18px 0}
.answer h2{font:700 15px "Bricolage Grotesque",sans-serif;margin:0 0 6px;color:var(--teal)}
.answer p{margin:0;white-space:pre-wrap}
.res{margin:22px 0}
.res .url{font-size:14px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res a.t{display:block;font:700 20px/1.3 "Bricolage Grotesque",sans-serif;color:var(--link);text-decoration:none;margin:2px 0 4px}
.res a.t:hover{text-decoration:underline}
.res p{margin:0;color:var(--ink)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:18px 0}
.imgs img{width:100%;height:130px;object-fit:cover;border-radius:8px;background:var(--line)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:18px 0}
.vids video{width:100%;border-radius:8px;background:#000;aspect-ratio:16/9}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.card audio{width:100%;margin-top:6px}
.card a,.vids a{color:var(--link);font-size:14px}
.card b{font-family:"Bricolage Grotesque",sans-serif}
.msg{color:var(--mute);margin:30px 0}
.msg.err{color:#c0392b}
.key{margin-top:40px;font-size:14px;color:var(--mute)}
.key summary{cursor:pointer}
.key input{width:100%;margin-top:8px;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
footer{padding:30px 0;color:var(--mute);font-size:14px;text-align:center}
@media(max-width:520px){body.has-results header.home{flex-direction:column;align-items:stretch;gap:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="home">
  <h1 class="logo" id="logo" title="Rudi mwanzo"><b>R</b>-<span>Search</span></h1>
  <div style="flex:1;width:100%">
    <p class="tag">Andika swali lako. Pata majibu kutoka mtandaoni.</p>
    <form id="f" role="search">
      <input type="search" id="q" placeholder="Tafuta chochote..." aria-label="Tafuta" autocomplete="off" autofocus>
      <button class="go" type="submit">Tafuta</button>
    </form>
  </div>
</header>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" aria-selected="true" data-m="web">Yote</button>
  <button class="tab" role="tab" aria-selected="false" data-m="img">Picha</button>
  <button class="tab" role="tab" aria-selected="false" data-m="vid">Video</button>
  <button class="tab" role="tab" aria-selected="false" data-m="aud">Sauti</button>
</div>
<main id="out" aria-live="polite"></main>
<details class="key" id="keybox">
  <summary>Mpangilio wa ufunguo wa Tavily</summary>
  <input type="password" id="key" placeholder="tvly-..." aria-label="Ufunguo wa Tavily API">
  <p>Ufunguo unahifadhiwa kwenye kivinjari chako tu.</p>
</details>
<footer>R-Search</footer>
</div>
<script>
const $=s=>document.querySelector(s);
const KEY_DEFAULT="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";
let mode="web", last="";
function getKey(){try{return localStorage.getItem("rs_key")||KEY_DEFAULT}catch(e){return KEY_DEFAULT}}
try{$("#key").value=localStorage.getItem("rs_key")||""}catch(e){}
$("#key").addEventListener("change",e=>{try{localStorage.setItem("rs_key",e.target.value.trim())}catch(_){}});
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n}
function safeUrl(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:"#"}catch(e){return "#"}}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return u}}
function msg(t,err){const o=$("#out");o.replaceChildren(el("p","msg"+(err?" err":""),t))}
async function search(q){
  const key=getKey();
  document.body.classList.add("has-results");
  if(mode!=="web")return media(q);
  if(!key){msg("Weka ufunguo wa Tavily chini ya ukurasa kwanza.",true);$("#keybox").open=true;return}
  msg("Inatafuta...");
  try{
    const r=await fetch("https://api.tavily.com/search",{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({query:q,search_depth:"advanced",max_results:10,include_answer:true,include_images:mode==="img"})});
    if(r.status===401){msg("Ufunguo si sahihi. Angalia ufunguo wako wa Tavily.",true);return}
    if(r.status===429){msg("Umefikia kikomo cha maombi. Jaribu tena baadaye.",true);return}
    if(!r.ok){msg("Hitilafu imetokea ("+r.status+"). Jaribu tena.",true);return}
    show(await r.json());
  }catch(e){msg("Imeshindwa kuunganisha. Angalia intaneti yako kisha ujaribu tena.",true)}
}
const PIX="57792634-5e89dd610e4c1c840f815c524";
async function toEn(text){
  try{
    const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q="+encodeURIComponent(text));
    if(!r.ok)return text;
    const j=await r.json();
    return (j[0]||[]).map(x=>x[0]).join("")||text;
  }catch(e){return text}
}
async function media(q){
  msg("Inatafuta...");
  const o=$("#out");
  try{
    const qe=(await toEn(q)).slice(0,100);
    if(mode==="img"||mode==="vid"){
      const base=mode==="img"?"https://pixabay.com/api/":"https://pixabay.com/api/videos/";
      const r=await fetch(base+"?key="+PIX+"&q="+encodeURIComponent(qe)+"&per_page=24&safesearch=true");
      if(r.status===429){msg("Umefikia kikomo cha maombi. Jaribu tena baadaye.",true);return}
      if(!r.ok){msg("Hitilafu imetokea ("+r.status+"). Jaribu tena.",true);return}
      const hits=(await r.json()).hits||[];
      if(!hits.length){msg("Hakuna matokeo ya \""+q+"\".");return}
      o.replaceChildren();
      const g=el("div",mode==="img"?"imgs":"vids");
      hits.forEach(h=>{
        if(mode==="img"){
          const a=el("a");a.href=safeUrl(h.pageURL);a.target="_blank";a.rel="noopener noreferrer";
          const im=el("img");im.src=safeUrl(h.webformatURL);im.alt=h.tags||q;im.loading="lazy";a.append(im);g.append(a);
        }else{
          const v=h.videos||{};const s=(v.tiny||v.small||v.medium||{}).url;if(!s)return;
          const box=el("div");const vd=document.createElement("video");
          vd.src=safeUrl(s);vd.controls=true;vd.preload="none";vd.playsInline=true;
          if(h.picture_id)vd.poster="https://i.vimeocdn.com/video/"+encodeURIComponent(h.picture_id)+"_640x360.jpg";
          const a=el("a","","Pixabay");a.href=safeUrl(h.pageURL);a.target="_blank";a.rel="noopener noreferrer";
          box.append(vd,a);g.append(box);
        }
      });
      o.append(g);return;
    }
    const r=await fetch("https://api.openverse.org/v1/audio/?page_size=15&q="+encodeURIComponent(qe));
    if(!r.ok){msg("Hitilafu imetokea ("+r.status+"). Jaribu tena.",true);return}
    const rs=(await r.json()).results||[];
    if(!rs.length){msg("Hakuna sauti zilizopatikana kwa \""+q+"\".");return}
    o.replaceChildren();
    rs.forEach(x=>{
      const c=el("div","card");
      c.append(el("b",null,x.title||"Bila jina"),el("div","url",(x.creator?x.creator+" · ":"")+"Leseni: "+(x.license||"")+" "+(x.license_version||"")));
      const au=document.createElement("audio");au.controls=true;au.preload="none";au.src=safeUrl(x.url);c.append(au);
      if(x.foreign_landing_url){const a=el("a",null,"Chanzo");a.href=safeUrl(x.foreign_landing_url);a.target="_blank";a.rel="noopener noreferrer";c.append(a)}
      o.append(c);
    });
  }catch(e){msg("Imeshindwa kuunganisha. Angalia intaneti yako kisha ujaribu tena.",true)}
}
async function sw(text){
  try{
    const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=sw&dt=t&q="+encodeURIComponent(text));
    if(!r.ok)return text;
    const j=await r.json();
    const out=(j[0]||[]).map(x=>x[0]).join("");
    return out||text;
  }catch(e){return text}
}
function show(d){
  const o=$("#out");o.replaceChildren();
  if(mode==="img"){
    const imgs=(d.images||[]).map(i=>typeof i==="string"?i:i.url).filter(Boolean);
    if(!imgs.length){o.append(el("p","msg","Hakuna picha zilizopatikana."));return}
    const g=el("div","imgs");
    imgs.forEach(u=>{const a=el("a");a.href=safeUrl(u);a.target="_blank";a.rel="noopener noreferrer";const im=el("img");im.src=safeUrl(u);im.alt=last;im.loading="lazy";a.append(im);g.append(a)});
    o.append(g);return;
  }
  if(d.answer){const a=el("section","answer");const ap=el("p",null,"Inatafsiri kwa Kiswahili...");a.append(el("h2",null,"Jibu la haraka"),ap);o.append(a);sw(d.answer).then(t=>{ap.textContent=t})}
  const rs=d.results||[];
  if(!rs.length){o.append(el("p","msg","Hakuna matokeo ya \""+last+"\". Jaribu maneno mengine."));return}
  rs.forEach(x=>{
    const b=el("article","res");
    const a=el("a","t",x.title||x.url);a.href=safeUrl(x.url);a.target="_blank";a.rel="noopener noreferrer";
    b.append(el("div","url",host(x.url)),a,el("p",null,(x.content||"").slice(0,260)+((x.content||"").length>260?"...":"")));
    o.append(b);
  });
}
$("#f").addEventListener("submit",e=>{e.preventDefault();const q=$("#q").value.trim();if(!q)return;last=q;history.replaceState(null,"","?q="+encodeURIComponent(q));search(q)});
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
  mode=t.dataset.m;if(last)search(last)}));
$("#logo").addEventListener("click",()=>{document.body.classList.remove("has-results");$("#out").replaceChildren();$("#q").value="";last="";history.replaceState(null,"",location.pathname)});
const p=new URLSearchParams(location.search).get("q");if(p){$("#q").value=p;last=p;search(p)}
</script>
</body>
</html>
