<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>R-Search AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f3;--panel:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d9e0e5;--red:#c8321e;--red-ink:#fff;--hi:#e8f04a;--bubble:#14202b;--bubble-ink:#fff;--r:14px;--f:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=dark]{--bg:#0e151b;--panel:#16212a;--ink:#e8eef2;--mute:#93a3b0;--line:#26343f;--red:#ff5a40;--red-ink:#10161b;--bubble:#e8f04a;--bubble-ink:#14202b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);transition:background .2s,color .2s}
button,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#app{display:flex;height:100dvh}
#side{width:25%;min-width:260px;max-width:340px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}.brand b{background:var(--red);color:var(--red-ink);padding:0 7px;border-radius:7px;margin-right:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;transition:background .15s}
.btn:hover{background:var(--bg)}.btn.pri{background:var(--red);color:var(--red-ink);border-color:var(--red);font-weight:600}
#hist{overflow:auto;flex:1}.grp{font-size:13px;color:var(--mute);margin:14px 6px 4px}
.it{display:flex;align-items:flex-start;border-radius:9px;gap:2px}.it:hover,.it.on{background:var(--bg)}
.it .t{flex:1;text-align:left;background:none;border:0;padding:9px 8px;overflow-wrap:anywhere;line-height:1.3}
.it .a{background:none;border:0;padding:6px;opacity:.55}.it .a:hover{opacity:1}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#menu{display:none}
#tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
#feed{flex:1;overflow:auto;padding:18px 14px 8px}
.wrap{max-width:780px;margin:0 auto}
.hero{text-align:center;margin-top:12vh}.hero h1{font-size:clamp(34px,7vw,56px);margin:0 0 8px;letter-spacing:-.03em;font-weight:800}
.hero p{color:var(--mute);margin:0 auto;max-width:440px}
.msg{margin:14px 0;display:flex}.msg.u{justify-content:flex-end}
.bub{background:var(--bubble);color:var(--bubble-ink);padding:10px 14px;border-radius:var(--r) var(--r) 4px var(--r);max-width:85%;white-space:pre-wrap;word-break:break-word}
.ai{width:100%}.ai .body{line-height:1.6}.ai .body h2,.ai .body h3,.ai .body h4,.ai .body h5{margin:14px 0 6px}
.ai .body p{margin:8px 0}.ai a{color:var(--red)}.ai code{background:var(--bg);padding:1px 5px;border-radius:5px}
.code{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:10px 0}.code pre{margin:0;padding:12px;overflow:auto}
.cp{position:absolute;top:6px;right:6px;font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.tw{overflow:auto}table{border-collapse:collapse}th,td{border:1px solid var(--line);padding:6px 10px}
.status{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.status summary{cursor:pointer}.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--red);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{opacity:.2}}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:s 1.2s infinite;margin:10px 0}@keyframes s{to{background-position:-200% 0}}
.src{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin:6px 0 12px}
.card{display:block;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.card:hover{border-color:var(--red)}.card b{display:block;font-size:14px;line-height:1.3;overflow-wrap:anywhere}.card small{color:var(--mute)}.card p{margin:4px 0 0;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.lab{font-size:14px;color:var(--mute);margin:12px 0 4px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 12px;font-size:14px}.chip:hover{border-color:var(--red)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.m{border:1px solid var(--line);background:var(--panel);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.m img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}.m .i{padding:8px 10px;font-size:13px;flex:1}.m .i b{display:block;overflow-wrap:anywhere}
.m a{margin:0 10px 10px;text-align:center;text-decoration:none;color:var(--red-ink);background:var(--red);border-radius:8px;padding:6px;font-size:13px;font-weight:600}
.au{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;margin:8px 0}.au .ic{font-size:26px}.au .x{flex:1;min-width:0}.au .x b{display:block;overflow-wrap:anywhere}
.au .bar{height:4px;background:var(--line);border-radius:4px;margin-top:6px}.au .bar i{display:block;width:0;height:100%;background:var(--red);border-radius:4px}
.au a{background:var(--red);color:var(--red-ink);border-radius:99px;padding:8px 14px;text-decoration:none;font-weight:600}
.err{border:1px solid var(--red);border-radius:12px;padding:12px;background:var(--panel)}
footer{padding:8px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px 8px;box-shadow:0 2px 10px rgba(20,32,43,.08)}
.box:focus-within{border-color:var(--red)}
textarea{flex:1;border:0;background:none;resize:none;max-height:140px;padding:9px 4px;outline:none;line-height:1.4}
.ib{border:0;background:none;font-size:20px;padding:8px;border-radius:50%}.ib:hover{background:var(--bg)}.ib.rec{background:var(--red)}
#send{background:var(--red);color:var(--red-ink);border-radius:50%;width:40px;height:40px;font-size:18px}
.note{max-width:780px;margin:4px auto 0;font-size:12px;color:var(--mute);text-align:center}
.sec{font-weight:800;font-size:18px;margin:24px 0 8px;letter-spacing:-.01em}
.m video{width:100%;aspect-ratio:16/9;background:#000;display:block}.grid.v{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.m .dl{margin:0 10px 10px;border:0;color:var(--red-ink);background:var(--red);border-radius:8px;padding:6px;font-size:13px;font-weight:600}
.m.off .i::after{content:"📴 Offline";display:block;color:var(--red);font-weight:600;margin-top:2px}
#scrim{display:none}
@media(max-width:800px){
#side{position:fixed;inset:0 auto 0 0;width:84%;max-width:320px;z-index:20;transform:translateX(-102%);transition:transform .2s}
#side.open{transform:none}#scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15}
#menu{display:block}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<aside id="side" aria-label="Historia">
  <div class="brand"><b>R</b>Search AI</div>
  <button class="btn pri" id="new" aria-label="Mazungumzo mapya">➕ New Chat</button>
  <div id="hist"></div>
</aside>
<div id="scrim"></div>
<main>
  <header>
    <button class="btn" id="menu" aria-label="Fungua menyu">☰</button>
    <nav id="tabs" role="tablist" aria-label="Aina ya utafutaji">
      <button class="tab" role="tab" data-m="web" aria-selected="true">🌐 Wavuti</button>
      <button class="tab" role="tab" data-m="images" aria-selected="false">🖼️ Picha</button>
      <button class="tab" role="tab" data-m="videos" aria-selected="false">🎥 Video</button>
      <button class="tab" role="tab" data-m="audio" aria-selected="false">🎧 Audio</button>
    </nav>
    <button class="btn" id="theme" aria-label="Badilisha mwonekano">🌙</button>
  </header>
  <section id="feed" aria-live="polite"><div class="wrap" id="msgs"></div></section>
  <footer>
    <div class="box">
      <button class="ib" id="attach" aria-label="Ambatisha faili la maandishi">📎</button>
      <input type="file" id="file" accept=".txt,.md,.csv" hidden>
      <textarea id="q" rows="1" placeholder="Uliza chochote..." aria-label="Uliza chochote"></textarea>
      <button class="ib" id="mic" aria-label="Sauti">🎤</button>
      <button id="send" class="ib" aria-label="Tuma">➤</button>
    </div>
    <div class="note">🌐 Utafutaji wa mtandaoni umewashwa · Enter kutuma, Shift+Enter mstari mpya</div>
  </footer>
</main>
</div>
<script>
/* ===== FUNGUO ZA API (badilisha hapa ukitaka) ===== */
const TAVILY_KEY = "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";
const PIXABAY_KEY = "57792634-5e89dd610e4c1c840f815c524";

const $ = s => document.querySelector(s);
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
let chats = [], cur = null, mode = 'web', busy = false;
const MODES = { web: 'Wavuti', images: 'Picha', videos: 'Video', audio: 'Audio' };
/* IndexedDB: historia (kv) + picha/video zilizohifadhiwa kwenye simu (media, kama Blob) */
const DB = new Promise((ok, no) => { const r = indexedDB.open('rsa', 1); r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('media') }; r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error) });
const tx = (st, m, fn) => DB.then(db => new Promise((ok, no) => { const t = db.transaction(st, m), q = fn(t.objectStore(st)); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error) }));
const kvGet = k => tx('kv', 'readonly', s => s.get(k)).catch(() => undefined);
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k)).catch(() => {});
const mGet = k => tx('media', 'readonly', s => s.get(k)).catch(() => undefined);
const mPut = (k, b) => tx('media', 'readwrite', s => s.put(b, k)).catch(() => {});
const save = () => kvSet('chats', JSON.parse(JSON.stringify(chats)));
const urls = new Map();
async function res(k) { if (!k) return ['', 0]; const b = await mGet(k); if (b) { let u = urls.get(k); if (!u) { u = URL.createObjectURL(b); urls.set(k, u) } return [u, 1] } return [navigator.onLine ? k : '', 0] }
async function hydrate() {
  for (const el of document.querySelectorAll('[data-k],[data-p]')) {
    const card = el.closest('.m');
    if (el.dataset.k) { const [u, c] = await res(el.dataset.k); if (u && el.getAttribute('src') !== u) el.src = u; if (c) card?.classList.add('off') }
    if (el.dataset.p) { const [u] = await res(el.dataset.p); if (u) el.poster = u }
  }
}
async function cacheOne(u) { if (!u || await mGet(u)) return; try { const r = await fetch(u); if (r.ok) await mPut(u, await r.blob()) } catch {} }
async function cacheMsg(m) {
  const jobs = []; (m.images || []).forEach(i => jobs.push(i.thumb));
  (m.videos || []).forEach(v => jobs.push(v.thumb)); (m.videos || []).slice(0, 4).forEach(v => v.file && jobs.push(v.file));
  for (const u of jobs) await cacheOne(u); hydrate()
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dom = u => { try { return new URL(u).hostname.replace(/^www\./, '') } catch { return '' } };
const safeUrl = u => /^https?:\/\//i.test(u) ? esc(u) : '#';

/* ---------- Markdown ---------- */
function inline(s) {
  s = esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s;
}
function md(t) {
  const out = [], L = (t || '').split('\n'); let i = 0, list = null;
  const close = () => { if (list) { out.push('</' + list + '>'); list = null } };
  const isRow = l => /^\|.*\|$/.test((l || '').trim());
  while (i < L.length) {
    const l = L[i]; let m;
    if (l.startsWith('```')) { close(); const c = []; i++; while (i < L.length && !L[i].startsWith('```')) c.push(L[i++]); i++; out.push('<div class="code"><button class="cp" aria-label="Nakili msimbo">Copy</button><pre>' + esc(c.join('\n')) + '</pre></div>'); continue }
    if (isRow(l) && /^\|[\s:|-]+\|$/.test((L[i + 1] || '').trim())) {
      close(); const row = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()); const h = row(l); i += 2; const rs = [];
      while (i < L.length && isRow(L[i])) rs.push(row(L[i++]));
      out.push('<div class="tw"><table><tr>' + h.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr>' + rs.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</table></div>'); continue
    }
    if (m = l.match(/^(#{1,4})\s+(.*)/)) { close(); const n = m[1].length + 1; out.push(`<h${n}>${inline(m[2])}</h${n}>`) }
    else if (m = l.match(/^\s*[-*•]\s+(.*)/)) { if (list != 'ul') { close(); out.push('<ul>'); list = 'ul' } out.push('<li>' + inline(m[1]) + '</li>') }
    else if (m = l.match(/^\s*\d+[.)]\s+(.*)/)) { if (list != 'ol') { close(); out.push('<ol>'); list = 'ol' } out.push('<li>' + inline(m[1]) + '</li>') }
    else if (!l.trim()) close();
    else { close(); out.push('<p>' + inline(l) + '</p>') }
    i++
  }
  close(); return out.join('')
}

/* ---------- Theme / drawer ---------- */
function setTheme(t) { document.documentElement.dataset.theme = t; $('#theme').textContent = t === 'dark' ? '☀️' : '🌙'; LS.set('rsa_theme', t) }
setTheme(LS.get('rsa_theme', matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
const drawer = o => { $('#side').classList.toggle('open', o); $('#scrim').classList.toggle('show', o) };
$('#menu').onclick = () => drawer(true); $('#scrim').onclick = () => drawer(false);

/* ---------- Modes ---------- */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setMode(b.dataset.m));
function setMode(m) {
  mode = m; document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.m === m));
  const ph = { web: 'Uliza chochote...', images: 'Tafuta picha...', videos: 'Tafuta video...', audio: 'Tafuta sauti au muziki...' };
  $('#q').placeholder = ph[m]; $('.note').firstChild.textContent = m === 'web' ? '🌐 Utafutaji wa mtandaoni umewashwa' : '🔎 Utafutaji wa ' + MODES[m]; $('#q').focus()
}

/* ---------- History ---------- */
function renderHist() {
  const day = 864e5, now = new Date().setHours(0, 0, 0, 0), g = { 'Today': [], 'Yesterday': [], 'Earlier': [] };
  [...chats].sort((a, b) => b.createdAt - a.createdAt).forEach(c => (c.createdAt >= now ? g.Today : c.createdAt >= now - day ? g.Yesterday : g.Earlier).push(c));
  $('#hist').innerHTML = Object.entries(g).filter(([, v]) => v.length).map(([k, v]) => `<div class="grp">${k}</div>` + v.map(c =>
    `<div class="it ${c.id === cur ? 'on' : ''}"><button class="t" data-open="${c.id}">${esc(c.title)}</button><button class="a" data-ren="${c.id}" aria-label="Badilisha jina">✏️</button><button class="a" data-del="${c.id}" aria-label="Futa">🗑️</button></div>`).join('')).join('')
    || '<div class="grp">Hakuna historia bado.</div>'
}
$('#hist').onclick = e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.open) { openChat(t.dataset.open); drawer(false) }
  if (t.dataset.ren) { const c = chats.find(x => x.id === t.dataset.ren), n = prompt('Jina jipya la mazungumzo:', c.title); if (n && n.trim()) { c.title = n.trim(); save(); renderHist() } }
  if (t.dataset.del && confirm('Futa mazungumzo haya?')) { chats = chats.filter(x => x.id !== t.dataset.del); save(); if (cur === t.dataset.del) newChat(); else renderHist() }
};
function newChat() { cur = null; renderMsgs(); renderHist(); $('#q').focus() }
$('#new').onclick = () => { newChat(); drawer(false) };
function openChat(id) { const c = chats.find(x => x.id === id); if (!c) return; cur = id; setMode(c.mode || 'web'); renderMsgs(); renderHist() }
function makeTitle(q) {
  let t = q.replace(/[?!.]+$/g, '').trim(); const m = t.match(/^how does (.+) work$/i); if (m) t = 'How ' + m[1] + ' Works';
  t = t.charAt(0).toUpperCase() + t.slice(1); return t
}

/* ---------- Render messages ---------- */
const dur = d => Math.floor(d / 60) + ':' + String(d % 60).padStart(2, '0');
const nm = t => esc(String(t || 'media').replace(/"/g, ''));
const imgsHTML = it => `<div class="grid">` + it.map(i => `<div class="m"><img loading="lazy" data-k="${esc(i.thumb)}" alt="${esc(i.title)}"><div class="i"><b>${esc(i.title)}</b></div><button class="dl" data-dl="${esc(i.thumb)}" data-name="${nm(i.title)}" aria-label="Pakua picha">⬇️ Pakua</button></div>`).join('') + `</div>`;
const vidsHTML = it => `<div class="grid v">` + it.map(i => `<div class="m"><video controls preload="none" playsinline data-k="${esc(i.file || '')}" data-p="${esc(i.thumb)}" aria-label="${esc(i.title)}"></video><div class="i"><b>▶️ ${esc(i.title)}</b>${dur(i.duration || 0)}</div>${i.file ? `<button class="dl" data-dl="${esc(i.file)}" data-name="${nm(i.title)}" aria-label="Pakua video">⬇️ Pakua</button>` : ''}</div>`).join('') + `</div>`;
const audHTML = it => it.map(i => `<div class="au"><span class="ic">🎧</span><div class="x"><b>${esc(i.title)}</b><p style="margin:4px 0 0;font-size:13px;color:var(--mute);overflow-wrap:anywhere">${esc(i.desc)}</p></div><a href="${safeUrl(i.url)}" target="_blank" rel="noopener noreferrer" aria-label="Sikiliza au pakua">🎧 Sikiliza</a></div>`).join('');
function msgHTML(m) {
  if (m.role === 'user') return `<div class="msg u"><div class="bub">${esc(m.text)}</div></div>`;
  let h = `<div class="msg"><div class="ai">`;
  if (m.error) return h + `<div class="err">⚠️ ${esc(m.error)}<br>${m.retry ? `<button class="btn" data-retry="${esc(m.retry)}" style="margin-top:8px">Jaribu tena</button>` : ''}</div></div></div>`;
  if (m.type === 'web') {
    h += `<details class="status"><summary>✓ Search completed · Sources: ${m.sources.length}</summary>Searched: “${esc(m.q)}”</details><div class="sec">🤖 Jibu la AI</div><div class="body">${md(m.text)}</div>`;
    if (m.sources.length) h += `<div class="sec">📚 Taarifa zaidi na vyanzo</div><div class="src">` + m.sources.map((s, i) => `<a class="card" href="${safeUrl(s.url)}" target="_blank" rel="noopener noreferrer"><small>🌐 [${i + 1}] ${esc(dom(s.url))}</small><b>${esc(s.title)}</b><p>${esc(s.content)}</p></a>`).join('') + `</div>`;
    if (m.images?.length) h += `<div class="sec">🖼️ Picha</div>` + imgsHTML(m.images);
    if (m.videos?.length) h += `<div class="sec">🎥 Video</div>` + vidsHTML(m.videos);
    if (m.audio?.length) h += `<div class="sec">🎧 Audio</div>` + audHTML(m.audio);
    if (m.related?.length) h += `<div class="sec">Unaweza pia kuuliza:</div><div class="chips">` + m.related.map(r => `<button class="chip" data-ask="${esc(r)}">${esc(r)}</button>`).join('') + `</div>`;
  } else if (m.type === 'images') h += imgsHTML(m.items);
  else if (m.type === 'videos') h += vidsHTML(m.items);
  else if (m.type === 'audio') h += audHTML(m.items);
  return h + `</div></div>`
}
function renderMsgs() {
  const c = chats.find(x => x.id === cur);
  $('#msgs').innerHTML = c && c.messages.length ? c.messages.map(msgHTML).join('') : `<div class="hero"><h1>R-Search AI</h1><p>Uliza chochote. Tafuta, elewa na pata majibu yenye vyanzo.</p></div>`;
  scrollEnd(); hydrate()
}
const scrollEnd = () => { const f = $('#feed'); f.scrollTop = f.scrollHeight };
$('#msgs').onclick = e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.ask) { $('#q').value = t.dataset.ask; send() }
  if (t.dataset.retry) { const c = chats.find(x => x.id === cur); c.messages.pop(); c.messages.pop(); save(); $('#q').value = t.dataset.retry; send() }
  if (t.dataset.dl) dl(t);
  if (t.classList.contains('cp')) { navigator.clipboard?.writeText(t.nextElementSibling.textContent); t.textContent = 'Copied ✓'; setTimeout(() => t.textContent = 'Copy', 1500) }
};

/* ---------- Download ---------- */
async function dl(btn) {
  const u = btn.dataset.dl; btn.textContent = '⏳ Inapakua...';
  try {
    let b = await mGet(u); if (!b) { const r = await fetch(u); if (!r.ok) throw 0; b = await r.blob(); mPut(u, b) }
    const a = document.createElement('a'), ext = (b.type.split('/')[1] || u.split('.').pop() || 'bin').replace('jpeg', 'jpg');
    a.href = URL.createObjectURL(b); a.download = 'R-Search-' + (btn.dataset.name || 'faili').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 40) + '.' + ext;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); btn.textContent = '✓ Imepakuliwa'
  } catch { btn.textContent = 'Imeshindikana · jaribu tena' }
  setTimeout(() => btn.textContent = '⬇️ Pakua', 2500)
}

/* ---------- API ---------- */
const DOWN = { msg: 'Samahani, search service haipatikani kwa sasa.', retry: true };
async function tav(body) {
  if (!TAVILY_KEY) throw { msg: 'Search service haijasanidiwa.' };
  let r; try { r = await fetch('https://api.tavily.com/search', { method: 'POST', headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + TAVILY_KEY }, body: JSON.stringify(body) }) } catch { throw DOWN }
  if (r.status === 401 || r.status === 403) throw { msg: 'Search service haijasanidiwa.' };
  if (!r.ok) throw DOWN; return r.json()
}
async function pix(kind, q) {
  if (!PIXABAY_KEY) throw { msg: 'Search service haijasanidiwa.' };
  let r; try { r = await fetch(`https://pixabay.com/api/${kind === 'videos' ? 'videos/' : ''}?key=${PIXABAY_KEY}&q=${encodeURIComponent(q.slice(0, 100))}&per_page=24&safesearch=true`) } catch { throw DOWN }
  if (!r.ok) throw DOWN; const d = await r.json();
  return (d.hits || []).map(h => kind === 'videos' ? { title: h.tags, thumb: `https://i.vimeocdn.com/video/${h.picture_id}_640x360.jpg`, file: h.videos?.tiny?.url || h.videos?.small?.url || h.videos?.medium?.url || '', url: h.pageURL, duration: h.duration, user: h.user } : { title: h.tags, thumb: h.webformatURL, url: h.pageURL, user: h.user })
}
const clean = t => String(t || '').replace(/\s*[-|–·]\s*(Pixabay|Freesound|Internet Archive)\b.*$/i, '').replace(/pixabay|freesound|archive\.org/gi, 'R-Search').trim();
const audioSearch = async q => (await tav({ query: q + ' sound effect music audio', max_results: 8, include_domains: ['pixabay.com', 'freesound.org', 'archive.org'] })).results?.map(r => ({ title: clean(r.title), url: r.url, desc: clean(r.content) })) || [];

/* ---------- Send ---------- */
async function send() {
  const q = $('#q').value.trim(); if (!q || busy) return;
  busy = true; $('#q').value = ''; autosize();
  let c = chats.find(x => x.id === cur);
  if (!c) { c = { id: uid(), title: makeTitle(q), mode, messages: [], createdAt: Date.now() }; chats.push(c); cur = c.id }
  c.mode = mode; c.messages.push({ role: 'user', text: q }); save(); renderMsgs(); renderHist();
  const holder = document.createElement('div');
  holder.innerHTML = `<div class="msg"><div class="ai"><div class="status"><span class="dots"><span></span><span></span><span></span></span> 🔎 Searching the web...<br><small>Searching: “${esc(q)}”</small></div><div class="sk"></div><div class="sk" style="width:80%"></div></div></div>`;
  $('#msgs').appendChild(holder); scrollEnd();
  let reply, mp = null; const none = { msg: 'Hakuna taarifa zinazolingana zilizopatikana.' };
  try {
    if (!navigator.onLine) throw { msg: 'Hauna intaneti. Unaweza kusoma historia yako (pamoja na picha na video zilizohifadhiwa), lakini utafutaji mpya unahitaji mtandao.', retry: true };
    if (mode === 'web') {
      mp = Promise.allSettled([pix('images', q), pix('videos', q), audioSearch(q)]);
      const d = await tav({ query: q, search_depth: 'advanced', include_answer: 'advanced', max_results: 10 });
      const srcs = (d.results || []).map(r => ({ title: r.title, url: r.url, content: r.content || '' }));
      if (!srcs.length && !d.answer) throw none;
      reply = { role: 'ai', type: 'web', q, text: d.answer || 'Hakuna muhtasari uliopatikana; tazama taarifa zaidi hapa chini.', sources: srcs, related: srcs.slice(1, 4).map(s => s.title).filter(Boolean) };
    } else if (mode === 'audio') {
      const items = await audioSearch(q); if (!items.length) throw none; reply = { role: 'ai', type: 'audio', items }
    } else {
      const items = await pix(mode, q); if (!items.length) throw none; reply = { role: 'ai', type: mode, items }
    }
  } catch (e) { reply = { role: 'ai', error: e.msg || 'Hitilafu imetokea.', retry: e.retry ? q : null } }
  c.messages.push(reply); save();
  if (reply.type === 'web') await stream(holder, reply, mp);
  else { holder.remove(); renderMsgs(); if (reply.type === 'images') cacheMsg({ images: reply.items }); if (reply.type === 'videos') cacheMsg({ videos: reply.items }) }
  busy = false
}
async function stream(holder, reply, mp) {
  const full = reply.text; holder.innerHTML = msgHTML({ ...reply, text: '', sources: [], related: [] }); const body = holder.querySelector('.body');
  for (let n = 0; n < full.length; n += 8) { body.innerHTML = md(full.slice(0, n)); scrollEnd(); await new Promise(r => setTimeout(r, 12)) }
  holder.innerHTML = msgHTML({ ...reply, related: [] }) + `<div class="msg"><div class="ai"><div class="status"><span class="dots"><span></span><span></span><span></span></span> 🖼️🎥🎧 Inaleta picha, video na audio...</div></div></div>`;
  const [im, vi, au] = await mp;
  reply.images = (im.value || []).slice(0, 12); reply.videos = (vi.value || []).slice(0, 6); reply.audio = (au.value || []).slice(0, 6);
  save(); renderMsgs(); cacheMsg(reply)
}

/* ---------- Input ---------- */
const autosize = () => { const t = $('#q'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px' };
$('#q').addEventListener('input', autosize);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() } });
$('#send').onclick = send;
$('#attach').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#q').value = (($('#q').value ? $('#q').value + '\n' : '') + r.result).slice(0, 380); autosize() }; r.readAsText(f); e.target.value = '' };
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) $('#mic').style.display = 'none'; else {
  const rec = new SR(); rec.lang = 'sw-TZ'; let on = false;
  rec.onresult = e => { $('#q').value = e.results[0][0].transcript; autosize() };
  rec.onend = () => { on = false; $('#mic').classList.remove('rec') };
  $('#mic').onclick = () => { if (on) rec.stop(); else { try { rec.start(); on = true; $('#mic').classList.add('rec') } catch {} } }
}
addEventListener('offline', () => $('.note').firstChild.textContent = '📴 Hauko mtandaoni · historia inasomeka');
addEventListener('online', () => setMode(mode));
(async () => {
  chats = (await kvGet('chats')) || LS.get('rsa_chats', []);
  renderMsgs(); renderHist(); setMode('web'); navigator.storage?.persist?.()
})();
</script>
</body>
</html>
