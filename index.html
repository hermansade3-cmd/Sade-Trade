a{color:var(--ac)}footer{text-align:center;color:var(--mu);font-size:.85rem;padding:20px 16px}

function sRes(s){const h=hits(s);$("#sr").innerHTML=!s.trim()?"":!h.length?`<p class="mu">${t("none")}</p>`:`<p class="mu">${t("results")}: ${h.length}</p><div class="grid">${h.map(c=>{const m=c.topics.filter(x=>x.toLowerCase().includes(s.toLowerCase().trim()));return cCard(c).replace("</article>",m.length?`<p class="mu">• ${m.join(" • ")}</p></article>`:"</article>")}).join("")}</div>`}
function vCourse(){const c=courses.find(x=>x.id==cid),l=lv(c.level),s=stat([c]),sr=sources[c.src];
return`<button class="btn o" data-go="courses:">${t("back")}</button><h1>🔥 ${pick(c,"title")}</h1><span class="pill">${t("level")} ${c.level} — ${lt(l)}</span><p>${pick(c,"description")}</p>${bar(s.p)}<p class="mu">${s.d} / ${s.n} ${t("total")}</p><h3>${t("obj")}</h3><p>${t("objt")}</p><h3>${t("topics")}</h3>${c.topics.map((x,i)=>`<div class="t ${isD(c,i)?"d":""}"><span>${i+1}. ${tn(x)}</span><span>${canRead(c.sourceUrl)?`<button class="btn" data-rt="${i}">📖 ${t("rd")}</button>`:`<a class="btn" href="${c.sourceUrl}" target="_blank" rel="noopener noreferrer">↗ ${t("rd")}</a>`}<button class="btn ${isD(c,i)?"":"o"}" data-tg="${i}" aria-pressed="${isD(c,i)}">${isD(c,i)?t("isdone"):t("done")}</button></span></div>`).join("")}<div class="warn">⚠️ ${pick(c,"note")||t("safe")}</div><p class="mu">📴 ${t("offline")}</p><p class="mu">${t("src")}: ${sr[0]}</p>${sb(c,"","open")}<button class="btn o" data-go="quiz:">${t("qz")}</button>`}
function vProgress(){const a=stat(courses);return`<h2 style="margin-top:8px">📊 ${t("mine")}</h2>${levels.map(l=>{const s=stat(courses.filter(c=>c.level==l.n));return`<div class="card" style="margin:10px 0"><b>${t("level")} ${l.n} — ${lt(l)}</b> <span class="mu">${s.p}%</span>${bar(s.p)}</div>`}).join("")}<h3>${a.d} / ${a.n} ${t("total")}</h3>`}
function vQuiz(){if(!qz){qz={o:quiz.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,5),i:0,s:0,a:null};}
if(qz.i>=qz.o.length)return`<h2>${t("qz")}</h2><div class="card"><h3>${t("score")}: ${qz.s} / ${qz.o.length}</h3><button class="btn" data-qr="1">${t("retry")}</button></div>`;
const x=quiz[qz.o[qz.i]],L=lang=="sw"?0:1;return`<h2 style="margin-top:8px">${t("qz")} ${qz.i+1}/${qz.o.length}</h2><div class="card"><h3>${x.q[L]}</h3>${x.o.map((o,i)=>`<button class="opt ${qz.a!=null?(i==x.a?"ok":i==qz.a?"no":""):""}" data-qa="${i}" ${qz.a!=null?"disabled":""}>${"ABCD"[i]}. ${o[L]}</button>`).join("")}${qz.a!=null?`<p><b>${qz.a==x.a?t("ok"):t("bad")}</b><br>${x.e[L]}</p><button class="btn" data-qn="1">${t("next")}</button>`:""}<p class="mu">${t("score")}: ${qz.s}</p></div>`}
function vSettings(){return`<h2 style="margin-top:8px">⚙️ ${t("settings")}</h2><div class="card"><p><b>${t("lang")}</b><br><button class="btn ${lang=="sw"?"":"o"}" data-l="sw">🇹🇿 Kiswahili</button><button class="btn ${lang=="en"?"":"o"}" data-l="en">🇬🇧 English</button></p><p><b>${t("theme")}</b><br><button class="btn ${theme=="light"?"":"o"}" data-t="light">${t("light")}</button><button class="btn ${theme=="dark"?"":"o"}" data-t="dark">${t("dark")}</button></p><p><button class="btn o" data-rs="1">${t("reset")}</button></p><p class="mu">🔒 ${t("pv")}</p></div>`}
function vMenu(){return`<h2 style="margin-top:8px">${t("menu")}</h2><div class="card">${["home","courses","search","progress","settings"].map(k=>`<p><button class="btn o" data-go="${k}:">${t(k)}</button></p>`).join("")}</div><h2>${t("srcs")}</h2><p class="mu">${t("ext")}</p>${Object.values(sources).map(s=>`<div class="card" style="margin:8px 0"><b>${s[0]}</b><br><a href="${s[1]}" target="_blank" rel="noopener noreferrer">${s[1]}</a></div>`).join("")}`}
/* ====== READER: leta chanzo, tafsiri, onyesha kwa muundo wetu ======
   Hosts zinazoruhusiwa (serikali/public). Ongeza host hapa ukipata ruhusa ya chanzo kingine. */
const readable=["www.usfa.fema.gov","apps.usfa.fema.gov","training.fema.gov","www.cdc.gov"];
const canRead=u=>{try{return readable.includes(new URL(u).hostname)}catch(e){return false}};
const sb=(c,cl,k)=>canRead(c.sourceUrl)?`<button class="btn ${cl}" data-rd="${c.id}">📖 ${t(k)}</button>`:`<a class="btn ${cl}" href="${c.sourceUrl}" target="_blank" rel="noopener noreferrer">${t(k)}</a>`;
const esc=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
let rd=null;
async function getBlocks(u,full){
const P=[["https://api.allorigins.win/raw?url=",0],["https://corsproxy.io/?url=",0],["https://r.jina.ai/",1]];
for(const[p,m]of P){try{const ac=new AbortController();setTimeout(()=>ac.abort(),20000);
const r=await fetch(p+(m?u:encodeURIComponent(u)),{signal:ac.signal});if(!r.ok)continue;const tx=await r.text(),seen={},b=[];
const add=(x,h)=>{x=x.replace(/\s+/g," ").trim();if(/^(Title|URL Source|Markdown Content|Published Time):/.test(x))return;if((x.length>40||(h&&x.length>3))&&!seen[x]){seen[x]=1;b.push({g:h?"h":"p",en:x.slice(0,450)})}};
if(m){tx.split("\n").forEach(l=>add(l.replace(/^#+\s*/,"").replace(/!\[[^\]]*\]\([^)]*\)/g,"").replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/^[*\-]\s+/,"").replace(/[*_`]/g,""),/^#+\s/.test(l)))}
else{const doc=new DOMParser().parseFromString(tx,"text/html");doc.querySelectorAll("script,style,nav,header,footer,form,svg,iframe,noscript,button").forEach(n=>n.remove());
(doc.querySelector("main,article,[role=main]")||doc.body).querySelectorAll("h1,h2,h3,p,li").forEach(n=>add(n.textContent,n.tagName[0]=="H"))}
if(b.length>=3)return b.slice(0,full?400:30)}catch(e){}}
throw 0}
async function trn(s){try{const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(s)+"&langpair=en|sw"),j=await r.json(),x=j.responseData.translatedText;return /MYMEMORY WARNING|QUERY LENGTH/i.test(x)?null:x}catch(e){return null}}
function rb(){const e=$("#rb");if(!e||!rd)return;e.innerHTML=rd.b.map(x=>{const s=(lang=="sw"&&!rd.en&&x.sw)?x.sw:x.en;return`<${x.g=="h"?"h3":"p"} class="rb">${esc(s)}</${x.g=="h"?"h3":"p"}>`}).join("");const s=$("#rs");if(s)s.textContent=rd.st=="load"?t("load"):rd.st=="tr"?t("tr"):rd.st=="err"?t("fail"):""}
const tn=x=>{const m=x.match(/^(.*?)\s*\((.*)\)\s*$/);return m&&lang=="en"?m[2]:x},tn0=x=>{const m=x.match(/\((.*)\)\s*$/);return(m?m[1]:x).split(/,|&/)[0].trim()};
const cut=s=>{if(s.length<=450)return s;const k=s.slice(0,450).lastIndexOf(". ");return k>150?s.slice(0,k+1):s.slice(0,450)};
async function topicBlocks(c,t){const all=await getBlocks(c.sourceUrl,1),k=t.toLowerCase(),ix=new Set();all.forEach((x,i)=>{if(x.en.toLowerCase().includes(k)){ix.add(i-1);ix.add(i);ix.add(i+1)}});const b=all.filter((_,i)=>ix.has(i)).slice(0,12);if(!b.length)throw 0;return b}
async function openRd(id,i){const c=courses.find(x=>x.id==id),tp=i!=null?tn0(c.topics[+i]):null,ck="fa_rd_"+id+(i!=null?"_"+i:"");rd={c,b:[],st:"load",en:false,tp,url:c.sourceUrl};go("read",id);
try{const o=ld(ck,"");if(o){rd.b=JSON.parse(o);rd.st="ok";rb();return}}catch(e){}
try{rd.b=tp?await topicBlocks(c,tp):await getBlocks(c.sourceUrl);rd.st=lang=="sw"?"tr":"ok";rb();
if(lang=="sw"){for(const x of rd.b){if(!rd||rd.c.id!=id)return;const s=await trn(x.en);if(s)x.sw=s;rb()}rd.st="ok";rb()}
try{if(rd.b.every(x=>x.sw))sv(ck,JSON.stringify(rd.b))}catch(e){}}catch(e){rd.st="err";rb()}}
function vRead(){const c=rd.c,sr=sources[c.src];return`<button class="btn o" data-go="course:${c.id}">${t("back")}</button><h1>📖 ${rd.tp||pick(c,"title")}</h1><p class="mu">${t("src")}: ${sr[0]}</p><div class="warn" id="rs"></div><div id="rb"></div><p class="mu">${lang=="sw"?t("mt"):""}</p><button class="btn o" data-en="1">${t("showEn")}</button><a class="btn" href="${rd.url}" target="_blank" rel="noopener noreferrer">${t("orig")}</a><p class="mu">${t("cp")}</p>`}
/* ====== RENDER ====== */
const NAV=[["home","🏠"],["courses","📚"],["search","🔎"],["progress","📊"],["settings","⚙️"]];
function render(){document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;$("#th").textContent=theme=="dark"?"☀️":"🌙";$("#lg").value=lang;
$("#nv").innerHTML=NAV.map(n=>`<button class="${view==n[0]||(view=="course"&&n[0]=="courses")||(view=="quiz"&&n[0]=="courses")?"on":""}" data-go="${n[0]}:" aria-label="${t(n[0])}"><span>${n[1]}</span>${t(n[0])}</button>`).join("");
$("#ft").innerHTML=`<b>FIRE ACADEMY TZ</b><br>${t("ftr")}<br><i>"${t("cp")}"</i>`;
$("#app").innerHTML={home:vHome,courses:vCourses,search:vSearch,course:vCourse,progress:vProgress,quiz:vQuiz,settings:vSettings,menu:vMenu,read:vRead}[view]();if(view=="read")rb();
const hs=$("#hs");if(hs)hs.oninput=()=>{go("search");$("#si").value=hs.value;$("#si").focus();sRes(hs.value)};
const si=$("#si");if(si)si.oninput=()=>sRes(si.value)}
function go(v,id){view=v;cid=id||null;if(v=="quiz")qz=null;render();scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("button,a");if(!b)return;const d=b.dataset;
if(d.go){const[v,id]=d.go.split(":");if(v=="courses"&&id)go("courses",id);else if(id&&v=="course")go("course",id);else go(v)}
else if(d.rd){openRd(d.rd)}
else if(d.rt!=null){openRd(cid,d.rt)}
else if(d.en){if(rd){rd.en=!rd.en;rb()}}
else if(d.tg!=null){const c=courses.find(x=>x.id==cid),k=key(c,+d.tg);prog[k]?delete prog[k]:prog[k]=1;sv("fa_prog",JSON.stringify(prog));const y=scrollY;render();scrollTo(0,y)}
else if(d.l){lang=d.l;sv("fa_lang",lang);render()}
else if(d.t){theme=d.t;sv("fa_theme",theme);render()}
else if(d.rs){if(confirm(t("sure"))){prog={};sv("fa_prog","{}");render()}}
else if(d.qa!=null){if(qz.a==null){qz.a=+d.qa;if(qz.a==quiz[qz.o[qz.i]].a)qz.s++;render()}}
else if(d.qn){qz.i++;qz.a=null;render()}
else if(d.qr){qz=null;render()}
else if(b.id=="mb")go("menu");
else if(b.id=="th"){theme=theme=="dark"?"light":"dark";sv("fa_theme",theme);render()}});
$("#lg").onchange=e=>{lang=e.target.value;sv("fa_lang",lang);render()};
render();
</script>
</body>
</html>
