  const top=el("div","stop"),x=el("button",null,"✕");x.onclick=svx;top.append(el("span",null,p.t.split(",").slice(0,2).join(", ")),x);
  const im=img(p.l||p.u,p.t);im.onerror=()=>{im.onerror=null;im.src=p.b?URL.createObjectURL(p.b):safe(p.u)};
  const l=el("button","tap l"),r=el("button","tap r");l.onclick=()=>show(n-1);r.onclick=()=>show(n+1);
  const ac=el("div","lbb"),dl=el("button",null,"⬇️ Pakua"),sa=el("button",null,"💾 Hifadhi");dl.onclick=()=>dlImg(p);
  sa.onclick=async()=>{try{const bl=p.b||await(await fetch(p.l||p.u)).blob();await dbput({k:"i:"+p.u,t:Date.now(),u:p.u,tags:p.t,blob:bl});sa.textContent="✔ Imehifadhiwa"}catch(e){sa.textContent="Imeshindikana"}};

 bo.append(el("div","tx",q),(()=>{const d=el("div","tm",tm()+" ");d.append(el("span","tick","✓✓"));return d})());f.append(ro);

function auds(){const f=document.createDocumentFragment();
 S.aud.forEach(a=>{const[r,b]=bub("in",1),row=el("div","vn"),p=el("button","pp","▶"),mid=el("div","mid"),bar=el("div","bar"),fill=el("i");bar.append(fill);

  au.ontimeupdate=()=>{fill.style.width=(au.duration?au.currentTime/au.duration*100:0)+"%";t1.textContent=mmss(au.currentTime)};
  au.onloadedmetadata=()=>t2.textContent=mmss(au.duration);
  bar.onclick=e=>{if(au.duration)au.currentTime=au.duration*(e.offsetX/bar.clientWidth)};
  f.append(r)});return f}
/* Hifadhi ya offline (IndexedDB) */
const DB=new Promise(res=>{try{const r=indexedDB.open("rsearch",1);r.onupgradeneeded=()=>r.result.createObjectStore("c",{keyPath:"k"});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
async function dbop(w,f){const d=await DB;if(!d)return null;return new Promise(r=>{try{const t=d.transaction("c",w?"readwrite":"readonly"),q=f(t.objectStore("c"));t.oncomplete=()=>r(q&&q.result!==undefined?q.result:null);t.onerror=t.onabort=()=>r(null)}catch(e){r(null)}})}
const dbput=o=>dbop(1,s=>s.put(o)),dbget=k=>dbop(0,s=>s.get(k)),dbdel=k=>dbop(1,s=>s.delete(k)),dball=()=>dbop(0,s=>s.getAll()).then(x=>x||[]);
async function saveSearch(v){const rec={k:"s:"+v.toLowerCase(),t:Date.now(),q:v,web:S.web,imgs:(S.imgs||[]).map(x=>({u:x.u,l:x.l,t:x.t}))};
 await dbput(rec);
 await Promise.all(rec.imgs.slice(0,12).map(async x=>{try{const r=await fetch(x.u);if(r.ok)x.b=await r.blob()}catch(e){}}));
 await dbput(rec)}

 if(!ss.length){o.append(el("p","msg","Bado hakuna. Kila unachotafuta kinahifadhiwa kiotomatiki, na kinafunguka hata bila intaneti."));return}
 ss.forEach(x=>{const c=el("div","card"),b=el("button","vid");b.append(el("div","rt","🔎 "+x.q),el("div","sn",new Date(x.t).toLocaleString("sw")+" • matokeo "+((x.web&&x.web.res)||[]).length));
  b.onclick=()=>{view=null;q=x.q;$("#q").value=q;S={web:x.web,imgs:x.imgs||[],pe:tr(q,"en").then(v=>v.slice(0,100)),note:navigator.onLine?"":"Unaona matokeo yaliyohifadhiwa."};setTab("all")};
  const d=el("button","more","🗑️ Futa");d.style.margin="0 14px 12px";d.onclick=async()=>{await dbdel(x.k);c.remove()};c.append(b,d);o.append(c)})}

 if(!im.length){o.append(el("p","msg","Bado hujahifadhi picha. Fungua picha yoyote kisha bonyeza 💾 Hifadhi."));return}
 const g=el("div","mas");im.sort((a,b)=>b.t-a.t).forEach((p,ix)=>{const f=el("figure"),i=el("img");i.src=URL.createObjectURL(p.blob);i.alt=p.tags||"";f.append(i);
  f.onclick=()=>gview(im.map(x=>({u:x.u,t:x.tags,b:x.blob})),ix,1);g.append(f)});o.append(g)}

/* Viewer ya picha */
function gview(L,i,sv){const v=$("#gv");v.classList.add("on");
 const show=n=>{if(n<0||n>=L.length)return;i=n;const p=L[n];v.replaceChildren();
  const top=el("div","gtop"),x=el("button",null,"←");x.onclick=gx;x.setAttribute("aria-label","Funga");
  top.append(x,el("span",null,(p.t||"").split(",").slice(0,2).join(", ")),el("small",null,(n+1)+"/"+L.length));
  const off=sv||!navigator.onLine,im=img(p.l||p.u,p.t,off?p.b:null);im.onerror=()=>{im.onerror=null;im.src=p.b?URL.createObjectURL(p.b):safe(p.u)};
  const pv=el("button","tap l"),nx=el("button","tap r");pv.onclick=()=>show(n-1);nx.onclick=()=>show(n+1);
  pv.setAttribute("aria-label","Iliyopita");nx.setAttribute("aria-label","Inayofuata");
  const ac=el("div","lbb"),dl=el("button",null,"⬇️ Pakua"),sa=el("button",null,sv?"🗑️ Futa":"💾 Hifadhi"),sh=el("button",null,"↗ Shiriki");
  dl.onclick=()=>dlImg({u:p.u,l:p.l,blob:p.b});
  sa.onclick=async()=>{if(sv){await dbdel("i:"+p.u);gx();showSavedImgs((await dball()).filter(x=>x.k[0]==="i"));return}
   try{const bl=p.b||await(await fetch(p.l||p.u)).blob();await dbput({k:"i:"+p.u,t:Date.now(),u:p.u,tags:p.t,blob:bl});sa.textContent="✔ Imehifadhiwa"}catch(e){sa.textContent="Imeshindikana"}};
  sh.onclick=async()=>{try{const bl=p.b||await(await fetch(p.l||p.u)).blob(),f=new File([bl],"picha.jpg",{type:bl.type||"image/jpeg"});
   if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{sh.textContent="Haipatikani";setTimeout(()=>sh.textContent="↗ Shiriki",1500)}}catch(e){}};
  ac.append(dl,sa,sh);v.append(top,im,pv,nx,ac)};
 v.ontouchstart=e=>{v._x=e.touches[0].clientX};
 v.ontouchend=e=>{const d=e.changedTouches[0].clientX-(v._x||0);if(Math.abs(d)>50)show(i+(d<0?1:-1))};
 show(i)}
function gx(){const v=$("#gv");v.classList.remove("on");v.replaceChildren()}

setTab("all");
dball().then(a=>{const l=a.filter(x=>x.k[0]==="s").sort((x,y)=>y.t-x.t)[0];
