(()=>{'use strict';

/* m|title|description|imageQuery|difficulty|minutes|objectives;|equipment|safety */
const RAW=`ff|Hose Operations|Deploying, handling and inspecting hose lines|firefighter hose|Basic|30|Identify hose types;Understand deployment;Know hose inspection|Hose,Nozzle,Couplings,PPE|Watch trip hazards and keep communication clear

ff|Ventilation|Why fire scenes are ventilated|firefighter ventilation|Intermediate|35|Explain ventilation goals;Compare horizontal and vertical;Recognise fire behaviour effects|Fans,Tools|Coordinate ventilation with the attack team

ppe|PPE Maintenance|Cleaning and storage|firefighter turnout gear cleaning|Basic|20|Know cleaning basics;Store correctly;Know repair rules|Cleaning kit|Follow manufacturer care labels

hz|HazMat Incident Reporting|Recording hazmat scenes|hazmat incident report|Basic|20|Record materials;Record actions;Report exposures|Report form|Record exposures accurately
rs|Structural Rescue|Rescue in damaged buildings|building rescue firefighter|Advanced|40|Assess structure;Set safe zones;Plan access|Rescue tools|Unstable structures endanger rescuers

rs|Collapse Rescue|Collapse patterns|building collapse rescue|Advanced|45|Know collapse types;Mark search areas;Understand shoring concepts|Shoring,Tools|Secondary collapse risk

const LESSONS=RAW.split('\n').map((l,i)=>{const[m,title,desc,q,diff,min,ob,eq,safety]=l.split('|');return{id:'L'+i,m,title,desc,q,diff,min:+min,obj:ob.split(';'),eq:eq.split(','),safety}});

const HC=[['1','Explosives'],['2','Gases'],['3','Flammable Liquids'],['4','Flammable Solids'],['5','Oxidizers / Organic Peroxides'],['6','Toxic / Infectious'],['7','Radioactive'],['8','Corrosive'],['9','Miscellaneous']];

const CHK=['Helmet','Hood','Coat','Gloves','Boots','SCBA','Facepiece','Cylinder','PASS device'];

const IF=[['num','Incident Number','text'],['date','Date','date'],['time','Time','time'],['loc','Location','text'],['type','Incident Type','sel',TYPES],['by','Reported By','text'],['station','Station','text'],['crew','Crew','text'],['unit','Vehicle/Unit','text'],['weather','Weather','text'],['occ','Occupancy','text'],['fire','Fire Involved?','yn'],['inj','Injuries?','yn'],['fat','Fatalities?','yn'],['resc','Rescue Required?','yn'],['hz','HazMat Involved?','yn'],['dmg','Property Damage?','yn'],['rescued','Persons Rescued','number'],['equip','Equipment Used','text'],['act','Actions Taken','area'],['obs','Observations','area'],['notes','Additional Notes','area'],['status','Status','sel',STAT]];
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s),enc=encodeURIComponent,app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tm;const toast=t=>{const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(tm);tm=setTimeout(()=>e.style.display='none',3200)};
const jget=async u=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}};
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3e4)};
/* ===== IndexedDB: FireRescueDB ===== */
const STORES=['lessons','progress','checklists','incidents','equipment','bookmarks','settings','syncQueue'];
let dbp;const openDB=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('FireRescueDB',1);r.onupgradeneeded=()=>STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const tx=async(s,m,f)=>{const d=await openDB();return new Promise((res,rej)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const addItem=(s,v)=>tx(s,'readwrite',o=>o.add(v)),updateItem=(s,v)=>tx(s,'readwrite',o=>o.put(v)),getItem=(s,id)=>tx(s,'readonly',o=>o.get(id)),getAll=s=>tx(s,'readonly',o=>o.getAll()),deleteItem=(s,id)=>tx(s,'readwrite',o=>o.delete(id));
/* ===== images: Unsplash then Pixabay, cached; fallback icon ===== */
async function getImage(q){
  const k='fr:img:'+q;try{const c=localStorage.getItem(k);if(c)return JSON.parse(c)}catch(e){}
  let o=null;
  try{if(CONFIG.UNSPLASH_ACCESS_KEY){const p=(await jget(`https://api.unsplash.com/search/photos?per_page=1&content_filter=high&query=${enc(q)}&client_id=${CONFIG.UNSPLASH_ACCESS_KEY}`)).results[0];
      if(p)o={url:p.urls.small,thumb:p.urls.thumb,alt:'Stock photo: '+(p.alt_description||q),photographer:p.user.name,photographerUrl:p.user.links.html+'?utm_source=fire_rescue&utm_medium=referral',src:'Unsplash'}}

      if(p)o={url:p.webformatURL,thumb:p.previewURL,alt:'Stock photo: '+p.tags,photographer:p.user,photographerUrl:p.pageURL,src:'Pixabay'}}}catch(e){}
  if(o)try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}
  return o}
async function blobUrl(u){try{const c=await caches.open('fr-img');let r=await c.match(u);if(!r){r=await fetch(u);if(r.ok)await c.put(u,r.clone())}return r.ok?URL.createObjectURL(await r.blob()):u}catch(e){return u}}

}

  app.innerHTML=`<h1>${MOD[m][0]} ${MOD[m][1]}</h1>${bar('Progress',modPct(m))}<div class="wn">${SAFE}</div><div class="g">${l.map(lcard).join('')}</div>${x}`};
const ppeExtras=async()=>{const c=await getItem('checklists','ppe'),s=(c&&c.items)||[];
  return `<h2 style="margin-top:24px">PPE Identification</h2><div class="g">${PPE.map((p,i)=>`<button class="c" data-a="ppe" data-id="${i}" style="text-align:left;color:inherit;cursor:pointer;font:inherit"><h3>${p[0]}</h3><span style="color:var(--mu);font-size:13px">Tap for details</span></button>`).join('')}</div>
  <h2 style="margin-top:24px">PPE Inspection Checklist</h2><div class="c" id="ck">${CHK.map(t=>`<label style="color:var(--fg)"><input type="checkbox" style="width:auto;min-height:0" value="${t}" ${s.includes(t)?'checked':''}> ${t}</label>`).join('')}<p id="ckc">${s.length} / ${CHK.length} completed</p><button class="bt" data-a="ckSave">SAVE INSPECTION</button></div>
  <h2 style="margin-top:24px">SCBA Air-Supply Calculator</h2><div class="c"><div class="fm"><label>Cylinder pressure (bar)<input id="cp" type="number" min="0" value="300"></label><label>Cylinder capacity (litres)<input id="cc" type="number" min="0" value="6.8" step="0.1"></label><label>Consumption (L/min)<input id="cr" type="number" min="1" value="40"></label></div><button class="bt" data-a="calc">Calculate</button><p id="cout"></p><div class="wn">Training estimate only: not a replacement for manufacturer instructions, fit testing, physiological monitoring or department procedures.</div></div>`};
const hzExtras=()=>`<h2 style="margin-top:24px">Hazard Classes</h2><div class="g">${HC.map(([n,t])=>`<div class="c"><b>Class ${n}</b><br>${t}</div>`).join('')}</div>
<h2 style="margin-top:24px">UN Number Search</h2><div class="c"><input id="un" placeholder="e.g. UN 1203" aria-label="Search UN number"><div id="unr"></div></div>`;
const unRows=q=>{q=q.replace(/un/i,'').trim().toLowerCase();const r=q?UN.filter(u=>u[0].includes(q)||u[1].toLowerCase().includes(q)):UN;return r.map(u=>`<div class="c" style="margin-top:8px"><b>UN ${u[0]}</b> · ${esc(u[1])}<br>Class ${u[2]} · ${esc(u[3])}</div>`).join('')||'<p>No match in demo dataset.</p>'};
function lesson(id){const l=LESSONS.find(x=>x.id===id);if(!l)return;AppState.currentLesson=id;
  try{const r=JSON.parse(localStorage.getItem('fr:recent')||'[]').filter(x=>x!==id);r.unshift(id);localStorage.setItem('fr:recent',JSON.stringify(r.slice(0,5)))}catch(e){}
  const pool=LESSONS.filter(x=>x.id!==id).flatMap(x=>x.obj),ans=l.obj[0],opts=[ans,...pool.sort(()=>Math.random()-.5).filter(x=>!l.obj.includes(x)).slice(0,3)].sort(()=>Math.random()-.5);
  const li=a=>`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`,p=PR[id];
  app.innerHTML=`<button class="bt s" data-a="go" data-id="${l.m}">← Back</button><div class="c lc" style="margin-top:12px">${imgBox(l.q,MOD[l.m][0])}<div class="b"><h1>${esc(l.title)}</h1><span class="tg">${l.diff}</span><span class="tg">${l.min} min</span><h3>Overview</h3><p>${esc(l.desc)}. ${NOTE}</p><h3>Learning objectives</h3>${li(l.obj)}<h3>Equipment</h3>${li(l.eq)}<h3>Safety considerations</h3>${li([l.safety,'Wear appropriate PPE and follow local SOP/SOG'])}<h3>Common mistakes</h3>${li(['Skipping size-up or communication','Working outside training and authority'])}<h3>Key points</h3>${li([l.obj[0],l.obj[l.obj.length-1]])}</div></div><div class="wn">${SAFE}</div>
  <div class="c"><h2>Quiz</h2><p>Which of these is a learning objective of “${esc(l.title)}”?</p>${opts.map((o,i)=>`<button class="op" data-a="ans" data-o="${esc(o)}" data-ok="${esc(ans)}">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}<div id="qr" aria-live="polite"></div><div class="row" style="margin-top:12px"><button class="bt" data-a="done" data-id="${id}">${p&&p.done?'✓ Completed':'Mark as completed'}</button><button class="bt s" data-a="bm" data-id="${id}">${BM[id]?'🔖 Saved':'🔖 Bookmark'}</button></div></div>`;
  loadImgs();window.scrollTo(0,0)}
/* ===== incidents ===== */
const fld=([k,l,t,o],v={})=>{const a=`name="${k}" id="f_${k}"`,val=v[k]??'';
  if(t==='sel')return `<label>${l}<select ${a}>${o.map(x=>`<option ${x===val||(!val&&x==='Draft')?'selected':''}>${x}</option>`).join('')}</select></label>`;
  if(t==='yn')return `<label>${l}<select ${a}>${['No','Yes'].map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')}</select></label>`;
  if(t==='area')return `<label class="w">${l}<textarea ${a} rows="3">${esc(val)}</textarea></label>`;
  return `<label>${l}<input ${a} type="${t}" value="${esc(val)}"></label>`};
let EDIT=null,IFILT={q:'',t:'',s:''};
async function incident(){const v=EDIT||{num:'INC-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.floor(Math.random()*9e3+1e3),date:new Date().toISOString().slice(0,10),status:'Draft'};
  app.innerHTML=`<h1>🚨 Incident Report</h1><p style="color:var(--mu)">Saved on this device first (IndexedDB). Works offline.</p><form id="if" class="c"><div class="fm">${IF.map(f=>fld(f,v)).join('')}</div><div class="row"><button type="button" class="bt s" data-a="isave" data-s="Draft">SAVE DRAFT</button><button type="button" class="bt" data-a="isave" data-s="Submitted">SUBMIT REPORT</button><button type="button" class="bt d" data-a="iclear">CLEAR FORM</button></div></form><h2 style="margin-top:20px">Recent Incidents</h2><div class="row"><input id="iq" placeholder="Search" value="${esc(IFILT.q)}" style="flex:2"><select id="it" style="flex:1"><option value="">All types</option>${TYPES.map(t=>`<option ${t===IFILT.t?'selected':''}>${t}</option>`).join('')}</select><select id="is" style="flex:1"><option value="">All status</option>${STAT.map(t=>`<option ${t===IFILT.s?'selected':''}>${t}</option>`).join('')}</select></div><div id="il"></div><div class="row" style="margin-top:12px"><button class="bt s" data-a="ejson">EXPORT JSON</button><button class="bt s" data-a="ecsv">EXPORT CSV</button></div>`;
  if(EDIT)EDIT=null;incList()}
const incFilter=async()=>(await getAll('incidents')).filter(i=>(!IFILT.t||i.type===IFILT.t)&&(!IFILT.s||i.status===IFILT.s)&&(!IFILT.q||JSON.stringify(i).toLowerCase().includes(IFILT.q.toLowerCase()))).sort((a,b)=>b.updated-a.updated);
async function incList(){const l=await incFilter(),e=$('#il');if(!e)return;
  e.innerHTML=l.map(i=>`<div class="c" style="margin-top:8px"><b>${esc(i.num)}</b> · ${esc(i.type)}<br><span style="color:var(--mu);font-size:13px">${esc(i.loc)} · ${esc(i.date)} · ${esc(i.status)}${i.synced?' · synced':' · local only'}</span><div class="row" style="margin-top:8px"><button class="bt s" data-a="iview" data-id="${i.id}">VIEW</button><button class="bt s" data-a="iedit" data-id="${i.id}">EDIT</button><button class="bt d" data-a="idel" data-id="${i.id}">DELETE</button><button class="bt s" data-a="iprint" data-id="${i.id}">EXPORT / PRINT</button></div></div>`).join('')||'<p>No reports found.</p>'}
async function trySync(){if(!CONFIG.SYNC_URL){toast('Saved locally. No sync server configured, so the report stays in the queue.');return}
  if(!navigator.onLine){toast('Offline: queued for sync.');return}
  for(const q of await getAll('syncQueue')){try{const r=await fetch(CONFIG.SYNC_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q.data)});if(!r.ok)throw 0;const i=await getItem('incidents',q.id);if(i){i.synced=true;await updateItem('incidents',i)}await deleteItem('syncQueue',q.id)}catch(e){toast('Sync failed; will retry later.');return}}
  toast('Synced.')}
const csv=l=>{const k=['id',...IF.map(f=>f[0])];return [k.join(','),...l.map(i=>k.map(x=>'"'+String(i[x]??'').replace(/"/g,'""')+'"').join(','))].join('\n')};
const pview=i=>{const p=$('#pv');p.innerHTML=`<div class="c"><h2>Fire Rescue Incident Report</h2>${IF.map(f=>`<p><b>${f[1]}:</b> ${esc(i[f[0]])}</p>`).join('')}<div class="row no"><button class="bt" onclick="window.print()">PRINT REPORT</button><button class="bt s" onclick="document.getElementById('pv').style.display='none'">Close</button></div></div>`;p.style.display='block'};
/* ===== equipment ===== */
async function equipment(){const l=await getAll('equipment'),today=new Date().toISOString().slice(0,10);
  app.innerHTML=`<h1>🔧 Equipment</h1><form id="ef" class="c"><div class="fm"><label>Name<select name="name">${['Fire hose','Nozzle','Pump','Ladder','SCBA','PPE','Radio','Halligan/tool','Rescue tools','Foam equipment'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Category<input name="cat"></label><label>Serial Number<input name="serial"></label><label>Condition<select name="cond"><option>GOOD</option><option>OUT OF SERVICE</option></select></label><label>Last Inspection<input type="date" name="last"></label><label>Next Inspection<input type="date" name="next"></label><label>Assigned Station<input name="stn"></label><label class="w">Notes<textarea name="notes" rows="2"></textarea></label></div><button type="button" class="bt" data-a="esave">SAVE</button></form><div style="margin-top:12px">${l.map(e=>{const s=e.cond==='GOOD'&&e.next&&e.next<today?'INSPECTION DUE':e.cond;return `<div class="c" style="margin-top:8px"><b>${esc(e.name)}</b> · ${esc(e.serial)} <span class="tg ${s==='GOOD'?'ok':''}">${s}</span><br><span style="color:var(--mu);font-size:13px">${esc(e.cat)} · ${esc(e.stn)} · next ${esc(e.next)}</span><br><button class="bt d" data-a="edel" data-id="${e.id}">DELETE</button></div>`}).join('')||'<p>No equipment recorded.</p>'}</div>`}
/* ===== training / settings / search ===== */
async function training(){app.innerHTML=`<h1>🎓 Training</h1><div class="c">${Object.entries(MOD).map(([m,[,t]])=>bar(t,modPct(m))).join('')}<p>Completed lessons: ${Object.values(PR).filter(p=>p.done).length} / ${LESSONS.length}</p><p style="color:var(--mu)">Certificate: placeholder. Issued by your department, not by this app.</p></div><h2 style="margin-top:20px">My Bookmarks</h2><div class="g">${LESSONS.filter(l=>BM[l.id]).map(lcard).join('')||'<p>No bookmarks yet.</p>'}</div>`;loadImgs()}
async function settings(){app.innerHTML=`<h1>⚙️ Settings</h1><div class="c"><h3>Image keys</h3><label>Unsplash Access Key (never paste a Secret key)<input id="ku" value="${esc(CONFIG.UNSPLASH_ACCESS_KEY)}" autocomplete="off"></label><label>Pixabay API key<input id="kp" value="${esc(CONFIG.PIXABAY_KEY)}" autocomplete="off"></label><label>Sync server URL (optional)<input id="ks" value="${esc(CONFIG.SYNC_URL)}"></label><button class="bt" data-a="ksave">SAVE</button></div><div class="c" style="margin-top:12px"><h3>Data</h3><div class="row"><button class="bt s" data-a="eall">EXPORT APP DATA</button><label class="bt s" style="margin:0;color:#fff">IMPORT APP DATA<input type="file" accept="application/json" id="imp" hidden></label><button class="bt d" data-a="clr">Clear local data</button></div></div><div class="c" style="margin-top:12px">Fire Rescue Command &amp; Training. ${NOTE}</div>`}
async function search(q){q=q.trim().toLowerCase();if(!q){route();return}
  const m=[...LESSONS.filter(l=>(l.title+l.desc+l.obj.join(' ')+l.eq.join(' ')).toLowerCase().includes(q)).map(l=>`<div class="c" style="margin-top:8px"><a href="#" data-a="open" data-id="${l.id}">${esc(l.title)}</a> <span class="tg">${MOD[l.m][1]}</span></div>`),
   ...PPE.filter(p=>p.join(' ').toLowerCase().includes(q)).map(p=>`<div class="c" style="margin-top:8px">PPE: <a href="#" data-a="go" data-id="ppe">${p[0]}</a></div>`),
   ...UN.filter(u=>u.join(' ').toLowerCase().includes(q)).map(u=>`<div class="c" style="margin-top:8px">UN ${u[0]} · ${esc(u[1])} · Class ${u[2]}</div>`),
   ...(await getAll('incidents')).filter(i=>JSON.stringify(i).toLowerCase().includes(q)).map(i=>`<div class="c" style="margin-top:8px">Report: <a href="#" data-a="go" data-id="incident">${esc(i.num)}</a> · ${esc(i.type)}</div>`),
   ...(await getAll('equipment')).filter(e=>JSON.stringify(e).toLowerCase().includes(q)).map(e=>`<div class="c" style="margin-top:8px">Equipment: ${esc(e.name)} ${esc(e.serial)}</div>`)];
  app.innerHTML=`<h1>Search: ${esc(q)}</h1>${m.join('')||'<p>No results.</p>'}`}
/* ===== router ===== */
function route(){const p=AppState.currentPage;$('#nv').innerHTML=NAV.map(([k,i,t])=>`<button data-a="go" data-id="${k}" class="${k===p?'on':''}" ${k===p?'aria-current="page"':''}><span>${i}</span>${t}</button>`).join('');
  ({dashboard,incident,equipment,training,settings}[p]||(()=>modPage(p)))();if(MOD[p]||p==='dashboard')setTimeout(loadImgs,0);window.scrollTo(0,0)}
const go=p=>{AppState.currentPage=p;$('#gs').value='';history.replaceState(null,'','#'+p);route()};
/* ===== events (delegation) ===== */
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;if(b.tagName==='A')e.preventDefault();
  if(a==='go')go(id);
  else if(a==='open')lesson(id);
  else if(a==='bm'){if(BM[id]){delete BM[id];await deleteItem('bookmarks',id)}else{BM[id]=1;await updateItem('bookmarks',{id})}toast(BM[id]?'Bookmarked':'Bookmark removed');$('#qr')?lesson(id):route()}
  else if(a==='ans'){const ok=b.dataset.o===b.dataset.ok;b.classList.add(ok?'y':'n');$('#qr').innerHTML=`<p><b>${ok?'Correct':'Incorrect'}</b>. Explanation: “${esc(b.dataset.ok)}” is one of this lesson’s objectives.</p>`;const l=LESSONS.find(x=>x.id===AppState.currentLesson),p=PR[l.id]||{id:l.id};p.score=ok?100:0;PR[l.id]=p;await updateItem('progress',p)}
  else if(a==='done'){const p=PR[id]||{id};p.done=true;PR[id]=p;await updateItem('progress',p);toast('Lesson completed');b.textContent='✓ Completed'}
  else if(a==='ppe'){const p=PPE[id];$('#pv').innerHTML=`<div class="c" style="background:var(--cd);color:var(--fg)"><h2>${p[0]}</h2><p><b>Purpose:</b> ${p[1]}</p><p><b>Inspection points:</b> ${p[2]}</p><p><b>Maintenance:</b> ${p[3]}</p><button class="bt" onclick="document.getElementById('pv').style.display='none'">Close</button></div>`;$('#pv').style.display='block'}
  else if(a==='ckSave'){const items=[...document.querySelectorAll('#ck input:checked')].map(x=>x.value);await updateItem('checklists',{id:'ppe',items,t:Date.now()});$('#ckc').textContent=items.length+' / '+CHK.length+' completed';toast('Inspection saved')}
  else if(a==='calc'){const P=+$('#cp').value,C=+$('#cc').value,R=+$('#cr').value;$('#cout').textContent=P>0&&C>0&&R>0?`Estimated air: ${Math.round(P*C)} L, about ${(P*C/R).toFixed(1)} minutes at ${R} L/min (before reserve margin).`:'Enter positive values.'}
  else if(a==='isave'){const f=$('#if'),v=Object.fromEntries(new FormData(f));v.status=b.dataset.s==='Submitted'&&v.status==='Draft'?'Submitted':v.status==='Draft'?b.dataset.s:v.status;if(!v.num||!v.loc){toast('Incident number and location are required');return}
    const old=(await getAll('incidents')).find(i=>i.num===v.num);const rec={...(old||{}),...v,id:old?old.id:String(Date.now()),updated:Date.now(),synced:false};await updateItem('incidents',rec);
    if(rec.status!=='Draft'){await updateItem('syncQueue',{id:rec.id,data:rec});await trySync()}else toast('Draft saved');incList()}
  else if(a==='iclear'){EDIT=null;incident()}
  else if(a==='iedit'){EDIT=await getItem('incidents',id);incident();window.scrollTo(0,0)}
  else if(a==='iview'||a==='iprint')pview(await getItem('incidents',id));
  else if(a==='idel'){if(confirm('Delete this report?')){await deleteItem('incidents',id);await deleteItem('syncQueue',id);incList()}}
  else if(a==='ejson')dl('incidents.json',JSON.stringify(await incFilter(),null,1),'application/json');
  else if(a==='ecsv')dl('incidents.csv',csv(await incFilter()),'text/csv');
  else if(a==='esave'){const v=Object.fromEntries(new FormData($('#ef')));await updateItem('equipment',{...v,id:String(Date.now())});toast('Saved');equipment()}
  else if(a==='edel'){await deleteItem('equipment',id);equipment()}
  else if(a==='ksave'){CONFIG.UNSPLASH_ACCESS_KEY=$('#ku').value.trim();CONFIG.PIXABAY_KEY=$('#kp').value.trim();CONFIG.SYNC_URL=$('#ks').value.trim();await updateItem('settings',{id:'keys',unsplash:CONFIG.UNSPLASH_ACCESS_KEY,pixabay:CONFIG.PIXABAY_KEY});toast('Saved')}
  else if(a==='eall'){const o={};for(const s of['progress','incidents','checklists','equipment','bookmarks','settings'])o[s]=await getAll(s);dl('fire-rescue-backup.json',JSON.stringify(o,null,1),'application/json')}
  else if(a==='clr'){if(confirm('Delete ALL local data?')){for(const s of STORES)for(const r of await getAll(s))await deleteItem(s,r.id);PR={};BM={};toast('Cleared');route()}}
});
document.addEventListener('change',async e=>{if(e.target.id==='imp'){try{const o=JSON.parse(await e.target.files[0].text());for(const s in o)if(STORES.includes(s))for(const r of o[s])await updateItem(s,r);await loadState();toast('Data imported');route()}catch(x){toast('Import failed: invalid file')}}
  if(e.target.id==='it'||e.target.id==='is'){IFILT.t=$('#it').value;IFILT.s=$('#is').value;incList()}});
let dt;document.addEventListener('input',e=>{const i=e.target.id;if(i==='gs'){clearTimeout(dt);dt=setTimeout(()=>search(e.target.value),250)}
  else if(i==='iq'){IFILT.q=e.target.value;clearTimeout(dt);dt=setTimeout(incList,200)}
  else if(i==='un')$('#unr').innerHTML=unRows(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#pv').style.display='none'});
$('#pv').addEventListener('click',e=>{if(e.target.id==='pv')e.target.style.display='none'});
/* ===== online status (navigator.onLine plus a real reachability probe) ===== */
async function ping(){let ok=navigator.onLine;if(ok){try{await fetch('https://www.gstatic.com/generate_204',{mode:'no-cors',cache:'no-store'})}catch(e){ok=false}}
  AppState.online=ok;$('#on').textContent=ok?'🟢 ONLINE':'🔴 OFFLINE';$('#on').title=ok?'':'Offline Mode: Core training and saved reports remain available.';if(!ok)toast('Offline Mode: Core training and saved reports remain available.');else trySync()}
addEventListener('online',ping);addEventListener('offline',ping);setInterval(ping,6e4);
document.addEventListener('DOMContentLoaded',()=>0);
(async()=>{try{await loadState()}catch(e){toast('Local storage unavailable: data will not persist.')}
  const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))AppState.currentPage=h;route();ping()})();
})();
</script></body></html>
